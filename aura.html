<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Aura Works</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Tahoma,sans-serif; background:#0b0d15; color:#e0e0e0; height:100vh; display:flex; padding:0; overflow:hidden; }
        #sidebar {
            width: 260px;
            background:#141824;
            border-right:1px solid #2a2f45;
            display:flex;
            flex-direction:column;
            flex-shrink:0;
            overflow:hidden;
            transition:width 0.3s ease;
            z-index:10;
        }
        #sidebar.collapsed { width:0; border-right:none; }
        #sidebar .header {
            padding:16px 16px 8px;
            border-bottom:1px solid #2a2f45;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-shrink:0;
        }
        #sidebar .header h2 { font-size:18px; font-weight:600; color:#b7bde0; }
        #sidebar .header button {
            background:#2a3050;
            border:none;
            border-radius:30px;
            padding:4px 14px;
            color:#d0d4e8;
            cursor:pointer;
            font-size:13px;
            border:1px solid #3a4060;
        }
        #sidebar .header button:hover { background:#3a4060; }
        #sidebar .chat-list {
            flex:1;
            overflow-y:auto;
            padding:8px 12px;
        }
        #sidebar .chat-list .chat-item {
            padding:8px 12px;
            border-radius:12px;
            margin-bottom:4px;
            cursor:pointer;
            display:flex;
            justify-content:space-between;
            align-items:center;
            transition:background 0.15s;
            border:1px solid transparent;
        }
        #sidebar .chat-list .chat-item:hover { background:#1e2438; }
        #sidebar .chat-list .chat-item.active { background:#2a3050; border-color:#4a507a; }
        #sidebar .chat-list .chat-item .title {
            font-size:14px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            max-width:150px;
        }
        #sidebar .chat-list .chat-item .delete-btn {
            background:transparent;
            border:none;
            color:#5a6080;
            cursor:pointer;
            font-size:14px;
            padding:0 4px;
            opacity:0.4;
            transition:opacity 0.15s;
        }
        #sidebar .chat-list .chat-item .delete-btn:hover { opacity:1; color:#f5a3a3; }
        #main {
            flex:1;
            display:flex;
            flex-direction:column;
            padding:16px 20px;
            overflow:hidden;
            min-width:0;
        }
        .header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:12px;
            border-bottom:1px solid #2a2f45;
            padding-bottom:10px;
            flex-shrink:0;
        }
        .header .logo {
            display:flex;
            align-items:center;
            gap:12px;
        }
        .header .logo .logo-svg {
            width:44px;
            height:44px;
            display:block;
            filter:drop-shadow(0 0 10px rgba(0,229,255,0.25));
        }
        .header .logo .logo-svg svg {
            width:100%;
            height:100%;
            display:block;
        }
        .header .logo .name {
            font-size:22px;
            font-weight:700;
            background:linear-gradient(135deg,#00e5ff,#ff33cc);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            letter-spacing:-0.5px;
        }
        .header .right {
            display:flex;
            align-items:center;
            gap:12px;
        }
        .header .right .toggle-sidebar {
            background:transparent;
            border:none;
            color:#6a72a0;
            font-size:24px;
            cursor:pointer;
            padding:4px 8px;
            border-radius:8px;
            transition:background 0.15s;
        }
        .header .right .toggle-sidebar:hover { background:#1e2438; }
        .chat-box {
            background:#0f1322;
            border-radius:16px;
            padding:12px;
            flex:1;
            overflow-y:auto;
            margin-bottom:12px;
            border:1px solid #1e2438;
            min-height:200px;
        }
        .chat-box::-webkit-scrollbar { width:5px; }
        .chat-box::-webkit-scrollbar-track { background:#0f1322; }
        .chat-box::-webkit-scrollbar-thumb { background:#2a2f45; border-radius:10px; }
        .message {
            margin-bottom:10px;
            display:flex;
            align-items:flex-start;
            gap:8px;
        }
        .message.user { flex-direction:row-reverse; }
        .message .avatar {
            width:30px;
            height:30px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:14px;
            font-weight:700;
            flex-shrink:0;
        }
        .message.aura .avatar {
            background:linear-gradient(135deg,#a78bfa,#6a8cff);
            color:#fff;
            box-shadow:0 0 10px rgba(167,139,250,0.3);
        }
        .message.user .avatar {
            background:#2a3050;
            color:#d0d4e8;
        }
        .message .bubble {
            max-width:80%;
            padding:8px 14px;
            border-radius:16px;
            font-size:15px;
            line-height:1.5;
            background:#1a1f33;
            border:1px solid #262b44;
            word-wrap:break-word;
        }
        .message.user .bubble {
            background:#2a3050;
            border-color:#3a4060;
        }
        .message.typing .bubble {
            color:#6a72a0;
            font-style:italic;
        }
        .message.system .bubble {
            background:#2a1f1f;
            border-color:#5a3a3a;
            color:#f5a3a3;
            text-align:center;
        }
        .input-area {
            display:flex;
            gap:10px;
            flex-shrink:0;
        }
        .input-area input {
            flex:1;
            background:#0f1322;
            border:1px solid #1e2438;
            border-radius:30px;
            padding:12px 16px;
            color:#d0d4e8;
            font-size:16px;
            outline:none;
            min-height:48px;
        }
        .input-area input:focus { border-color:#4a507a; }
        .input-area input::placeholder { color:#5a6080; }
        .input-area button {
            background:#2a3050;
            border:none;
            border-radius:30px;
            padding:12px 24px;
            color:#d0d4e8;
            font-size:16px;
            cursor:pointer;
            border:1px solid #3a4060;
            transition:0.2s;
            min-height:48px;
            white-space:nowrap;
            flex-shrink:0;
        }
        .input-area button:hover { background:#3a4060; }
        .input-area button:disabled { opacity:0.5; cursor:not-allowed; }
        .hint {
            font-size:11px;
            color:#4a507a;
            text-align:center;
            margin-top:8px;
            flex-shrink:0;
        }
        @media (max-width:600px) {
            #sidebar { width:200px; }
            #sidebar .chat-list .chat-item .title { max-width:110px; }
            .header .logo .name { font-size:18px; }
            .input-area input { font-size:14px; padding:10px 14px; }
            .input-area button { font-size:14px; padding:10px 16px; }
            .message .bubble { font-size:14px; padding:6px 12px; }
        }
        @media (max-width:480px) {
            #sidebar { width:180px; }
            .header .right .toggle-sidebar { font-size:20px; }
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="header">
            <h2>💬 Chats</h2>
            <button id="newChatBtn">+ New</button>
        </div>
        <div class="chat-list" id="chatList"></div>
    </div>
    <div id="main">
        <div class="header">
            <div class="logo">
                <span class="logo-svg">
                    <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <filter id="neon-cyan" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
                                <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur2" />
                                <feMerge>
                                    <feMergeNode in="blur1"/>
                                    <feMergeNode in="blur2"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                            <filter id="neon-pink" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1" />
                                <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur2" />
                                <feMerge>
                                    <feMergeNode in="blur1"/>
                                    <feMergeNode in="blur2"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                            <g id="mandala-wedge">
                                <path d="M 250,85 L 220,145 L 245,175 L 250,160 L 255,175 L 280,145 Z" fill="none" stroke="#ff33cc" stroke-width="5" filter="url(#neon-pink)" stroke-linejoin="round" stroke-linecap="round" />
                                <path d="M 240,138 L 250,125 L 260,138" fill="none" stroke="#ff80ff" stroke-width="3" filter="url(#neon-pink)" stroke-linejoin="round" stroke-linecap="round" />
                                <path d="M 250,145 L 215,175 L 215,215 L 250,225 L 285,215 L 285,175 Z" fill="none" stroke="#ff33cc" stroke-width="2" opacity="0.6" filter="url(#neon-pink)" stroke-linejoin="round" />
                            </g>
                        </defs>
                        <g id="pink-mandala">
                            <use href="#mandala-wedge" transform="rotate(0 250 250)" />
                            <use href="#mandala-wedge" transform="rotate(30 250 250)" />
                            <use href="#mandala-wedge" transform="rotate(60 250 250)" />
                            <use href="#mandala-wedge" transform="rotate(90 250 250)" />
                            <use href="#mandala-wedge" transform="rotate(120 250 250)" />
                            <use href="#mandala-wedge" transform="rotate(150 250 250)" />
                            <use href="#mandala-wedge" transform="rotate(180 250 250)" />
                            <use href="#mandala-wedge" transform="rotate(210 250 250)" />
                            <use href="#mandala-wedge" transform="rotate(240 250 250)" />
                            <use href="#mandala-wedge" transform="rotate(270 250 250)" />
                            <use href="#mandala-wedge" transform="rotate(300 250 250)" />
                            <use href="#mandala-wedge" transform="rotate(330 250 250)" />
                        </g>
                        <g id="cyan-star">
                            <polygon points="250,165 195,250 305,250" fill="none" stroke="#00e5ff" stroke-width="6" filter="url(#neon-cyan)" stroke-linejoin="round" />
                            <polygon points="250,235 195,150 305,150" fill="none" stroke="#00e5ff" stroke-width="6" filter="url(#neon-cyan)" stroke-linejoin="round" />
                        </g>
                    </svg>
                </span>
                <span class="name">Aura</span>
            </div>
            <div class="right">
                <button class="toggle-sidebar" id="toggleSidebar" title="Toggle sidebar">☰</button>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message aura">
                <div class="avatar">A</div>
                <div class="bubble">Hi, I'm Aura. Ask me anything.</div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Talk to Aura..." autofocus>
            <button id="sendBtn">Send</button>
        </div>
        <div class="hint">Teach: "X means Y" &bull; Forget: "delete X"</div>
    </div>

<script>
    let currentSessionId = null;
    let sessions = [];
    let knowledge = {};
    let conversationHistory = [];
    let currentMessages = [];

    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatList = document.getElementById('chatList');
    const newChatBtn = document.getElementById('newChatBtn');
    const toggleSidebarBtn = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');

    const dataset = {
        "love": "a deep feeling of affection",
        "trust": "belief in someone's honesty",
        "hope": "feeling that good things will happen",
        "freedom": "power to act without restriction",
        "peace": "state of calm",
        "joy": "great happiness",
        "courage": "ability to face fear",
        "kindness": "being friendly and considerate",
        "gratitude": "being thankful",
        "wisdom": "knowledge from experience",
        "ai": "artificial intelligence",
        "robot": "machine that performs tasks",
        "computer": "device that processes data",
        "internet": "global network",
        "python": "programming language",
        "data": "information",
        "cloud": "online storage",
        "bitcoin": "digital currency",
        "quantum": "study of smallest scales",
        "physics": "study of matter and energy",
        "gravity": "force that attracts objects",
        "light": "electromagnetic radiation",
        "sound": "vibration",
        "energy": "ability to do work",
        "matter": "has mass and takes space",
        "dna": "genetic instructions",
        "evolution": "change over time",
        "galaxy": "system of stars",
        "planet": "celestial body",
        "star": "luminous sphere",
        "moon": "natural satellite",
        "sun": "center of solar system",
        "earth": "our planet",
        "space": "emptiness between bodies",
        "time": "progression of existence",
        "life": "condition of living",
        "death": "end of life",
        "brain": "organ that controls thought",
        "heart": "organ that pumps blood",
        "human": "member of Homo sapiens",
        "science": "systematic study",
        "art": "creative expression",
        "music": "sounds producing beauty",
        "history": "study of past",
        "water": "clear liquid essential for life",
        "fire": "chemical reaction producing heat",
        "air": "mixture of gases",
        "food": "substance consumed for nutrition"
    };

    function loadKnowledge() {
        try {
            const s = localStorage.getItem('auraKnowledge');
            if (s) {
                const u = JSON.parse(s);
                for (let key in u) {
                    knowledge[key] = u[key];
                }
            }
        } catch(e) {}
        for (let key in dataset) {
            if (!knowledge[key]) knowledge[key] = dataset[key];
        }
    }
    function saveKnowledge() {
        const u = {};
        for (let key in knowledge) {
            if (!dataset[key]) {
                u[key] = knowledge[key];
            }
        }
        localStorage.setItem('auraKnowledge', JSON.stringify(u));
    }
    loadKnowledge();

    function loadSessions() {
        try {
            const s = localStorage.getItem('auraSessions');
            if (s) {
                sessions = JSON.parse(s);
                sessions = sessions.filter(s => s.id && Array.isArray(s.messages));
                sessions.sort((a,b) => b.timestamp - a.timestamp);
                return;
            }
        } catch(e) {}
        sessions = [];
    }
    function saveSessions() {
        localStorage.setItem('auraSessions', JSON.stringify(sessions));
    }

    function saveCurrentSession() {
        if (currentSessionId) {
            const cur = sessions.find(s => s.id === currentSessionId);
            if (cur) {
                cur.messages = currentMessages.slice();
                cur.timestamp = Date.now();
                if (currentMessages.length > 0 && cur.title === 'New Chat') {
                    const first = currentMessages.find(m => m.role === 'user');
                    if (first) cur.title = first.text.slice(0, 30) + (first.text.length > 30 ? '…' : '');
                }
                saveSessions();
            }
        }
    }

    function createSession(title) {
        const id = Date.now().toString(36) + Math.random().toString(36).substr(2,4);
        const session = {
            id: id,
            title: title || 'New Chat',
            messages: [],
            timestamp: Date.now()
        };
        sessions.unshift(session);
        saveSessions();
        return session;
    }

    function switchToSession(sessionId) {
        saveCurrentSession();
        const session = sessions.find(s => s.id === sessionId);
        if (!session) return;
        currentSessionId = sessionId;
        currentMessages = session.messages ? session.messages.slice() : [];
        conversationHistory = [];
        for (let msg of currentMessages) {
            if (msg.role === 'user') conversationHistory.push({ role: 'user', content: msg.text });
            else if (msg.role === 'aura') conversationHistory.push({ role: 'assistant', content: msg.text });
        }
        renderMessages();
        renderChatList();
        userInput.placeholder = session.title === 'New Chat' ? 'Talk to Aura...' : 'Continue chat...';
    }

    function renderMessages() {
        chatBox.innerHTML = '';
        if (currentMessages.length === 0) {
            const div = document.createElement('div');
            div.className = 'message aura';
            div.innerHTML = `<div class="avatar">A</div><div class="bubble">Hi, I'm Aura. Ask me anything.</div>`;
            chatBox.appendChild(div);
        } else {
            for (let msg of currentMessages) {
                const div = document.createElement('div');
                div.className = 'message ' + msg.role;
                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                if (msg.role === 'user') avatar.textContent = 'U';
                else if (msg.role === 'system') avatar.textContent = '!';
                else avatar.textContent = 'A';
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.textContent = msg.text;
                div.appendChild(avatar);
                div.appendChild(bubble);
                chatBox.appendChild(div);
            }
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderChatList() {
        chatList.innerHTML = '';
        if (sessions.length === 0) {
            const empty = document.createElement('div');
            empty.style.cssText = 'padding:16px;color:#4a507a;font-size:13px;text-align:center;';
            empty.textContent = 'No chats yet';
            chatList.appendChild(empty);
            return;
        }
        for (let s of sessions) {
            const item = document.createElement('div');
            item.className = 'chat-item' + (s.id === currentSessionId ? ' active' : '');
            const titleSpan = document.createElement('span');
            titleSpan.className = 'title';
            titleSpan.textContent = s.title || 'Chat';
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.textContent = '✕';
            delBtn.title = 'Delete chat';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm('Delete this chat?')) {
                    sessions = sessions.filter(x => x.id !== s.id);
                    saveSessions();
                    if (s.id === currentSessionId) {
                        if (sessions.length > 0) {
                            switchToSession(sessions[0].id);
                        } else {
                            const newS = createSession('New Chat');
                            currentSessionId = newS.id;
                            currentMessages = [];
                            conversationHistory = [];
                            renderMessages();
                            renderChatList();
                            userInput.placeholder = 'Talk to Aura...';
                        }
                    } else {
                        renderChatList();
                    }
                }
            });
            item.appendChild(titleSpan);
            item.appendChild(delBtn);
            item.addEventListener('click', () => {
                if (s.id !== currentSessionId) {
                    switchToSession(s.id);
                }
            });
            chatList.appendChild(item);
        }
    }

    function appendMessage(role, text, isSystem = false) {
        const msg = { role: role, text: text };
        currentMessages.push(msg);
        if (role === 'user') {
            conversationHistory.push({ role: 'user', content: text });
        } else if (role === 'aura') {
            conversationHistory.push({ role: 'assistant', content: text });
        }
        if (role === 'user' && currentMessages.length === 1) {
            const session = sessions.find(s => s.id === currentSessionId);
            if (session && session.title === 'New Chat') {
                session.title = text.slice(0, 30) + (text.length > 30 ? '…' : '');
                saveSessions();
                renderChatList();
                userInput.placeholder = 'Continue chat...';
            }
        }
        const div = document.createElement('div');
        div.className = 'message ' + role + (isSystem ? ' system' : '');
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        if (role === 'user') avatar.textContent = 'U';
        else if (role === 'system') avatar.textContent = '!';
        else avatar.textContent = 'A';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        div.appendChild(avatar);
        div.appendChild(bubble);
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        saveCurrentSession();
        return div;
    }

    function finalizeReply(typingDiv, reply) {
        const bubble = typingDiv.querySelector('.bubble');
        if (bubble) bubble.textContent = reply;
        typingDiv.classList.remove('typing');
        const lastMsg = currentMessages[currentMessages.length - 1];
        if (lastMsg && lastMsg.role === 'aura') {
            lastMsg.text = reply;
            if (conversationHistory.length > 0 && conversationHistory[conversationHistory.length-1].role === 'assistant') {
                conversationHistory[conversationHistory.length-1].content = reply;
            }
        }
        saveCurrentSession();
        renderChatList();
    }

    async function callServer(endpoint, query) {
        try {
            const url = `/?${endpoint}=${encodeURIComponent(query)}&model=auto&history=${encodeURIComponent(JSON.stringify(conversationHistory))}`;
            const resp = await fetch(url);
            if (!resp.ok) {
                return { error: 'Server is under maintenance. Please try again later.' };
            }
            const data = await resp.json();
            if (data.error) return { error: data.error };
            return data;
        } catch(e) {
            return { error: 'The server is currently under maintenance. Please try again later.' };
        }
    }

    async function getDDG(query) {
        try {
            const url = 'https://api.duckduckgo.com/?q=' + encodeURIComponent(query) + '&format=json';
            const resp = await fetch(url);
            const data = await resp.json();
            if (data.AbstractText && data.AbstractText !== '') return data.AbstractText;
            if (data.RelatedTopics && data.RelatedTopics.length > 0 && data.RelatedTopics[0].Text) {
                return data.RelatedTopics[0].Text.replace(/<[^>]+>/g, '');
            }
            return null;
        } catch(e) { return null; }
    }

    async function getReply(input) {
        const raw = input.trim();
        const lower = raw.toLowerCase();

        const learnMatch = raw.match(/^(.+?)\s*means\s*(.+)$/i) || raw.match(/^(.+?)\s*=\s*(.+)$/i);
        if (learnMatch) {
            const word = learnMatch[1].trim().toLowerCase();
            const def = learnMatch[2].trim();
            if (word.length > 2 && !['i','you','he','she','it','we','they','me','him','her','us','them'].includes(word)) {
                knowledge[word] = def;
                saveKnowledge();
                return '✅ I learned "' + word + '" = "' + def + '"';
            }
            return "I don't need to learn '" + word + "'.";
        }

        const delMatch = raw.match(/^(.+?)\s+is\s+wrong$/i) || raw.match(/^delete\s+(.+)$/i) || raw.match(/^remove\s+(.+)$/i);
        if (delMatch) {
            const word = delMatch[1].trim().toLowerCase();
            if (knowledge[word]) {
                const old = knowledge[word];
                delete knowledge[word];
                saveKnowledge();
                return '🗑️ Deleted "' + word + '" (was "' + old + '")';
            }
            return "I don't know '" + word + "'.";
        }

        const whatMatch = raw.match(/^what\s+is\s+(.+)$/i);
        if (whatMatch) {
            const topic = whatMatch[1].trim().toLowerCase();
            if (knowledge[topic]) {
                return topic + ' = ' + knowledge[topic];
            }
        }

        const result = await callServer('chat', raw);
        if (result && result.response) {
            conversationHistory.push({ role: 'user', content: raw });
            conversationHistory.push({ role: 'assistant', content: result.response });
            return result.response;
        }

        const ddgReply = await getDDG(raw);
        if (ddgReply) {
            conversationHistory.push({ role: 'user', content: raw });
            conversationHistory.push({ role: 'assistant', content: ddgReply });
            return ddgReply;
        }

        const fallbacks = [
            "I don't know the answer to that. Can you ask something else?",
            "Hmm, I'm not sure. What do you think?",
            "That's a good question. I don't have an answer right now.",
            "I'm not sure about that. Tell me more."
        ];
        const reply = fallbacks[Math.floor(Math.random() * fallbacks.length)];
        conversationHistory.push({ role: 'user', content: raw });
        conversationHistory.push({ role: 'assistant', content: reply });
        return reply;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;

        if (!currentSessionId) {
            const session = createSession('New Chat');
            currentSessionId = session.id;
        }

        appendMessage('user', text);

        const typingDiv = appendMessage('aura', '🤔 Thinking...');
        typingDiv.classList.add('typing');

        try {
            const reply = await getReply(text);
            finalizeReply(typingDiv, reply);
        } catch(e) {
            finalizeReply(typingDiv, 'Error: ' + e.message);
        }

        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
    }

    newChatBtn.addEventListener('click', () => {
        saveCurrentSession();
        const session = createSession('New Chat');
        currentSessionId = session.id;
        currentMessages = [];
        conversationHistory = [];
        renderMessages();
        renderChatList();
        userInput.placeholder = 'Talk to Aura...';
        userInput.focus();
    });

    toggleSidebarBtn.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
    });

    loadSessions();
    if (sessions.length === 0) {
        const session = createSession('New Chat');
        currentSessionId = session.id;
        currentMessages = [];
        conversationHistory = [];
    } else {
        const latest = sessions[0];
        currentSessionId = latest.id;
        currentMessages = latest.messages ? latest.messages.slice() : [];
        conversationHistory = [];
        for (let msg of currentMessages) {
            if (msg.role === 'user') conversationHistory.push({ role: 'user', content: msg.text });
            else if (msg.role === 'aura') conversationHistory.push({ role: 'assistant', content: msg.text });
        }
        userInput.placeholder = latest.title === 'New Chat' ? 'Talk to Aura...' : 'Continue chat...';
    }
    renderMessages();
    renderChatList();

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
    userInput.focus();

    window.addEventListener('beforeunload', () => {
        saveCurrentSession();
    });
</script>
</body>
</html>
