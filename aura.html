<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura – AI Chat</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background:#0b0d15; color:#e0e0e0; height:100vh; overflow:hidden; }
        #loginOverlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center;
            z-index:1000; backdrop-filter:blur(4px);
        }
        #loginOverlay.hidden { display:none; }
        .login-box {
            background:#1e1f2e; padding:40px; border-radius:20px; width:100%; max-width:400px;
            box-shadow:0 0 40px rgba(106,140,255,0.15);
            border:1px solid #2a2b3d;
        }
        .login-box h2 { text-align:center; margin-bottom:8px; font-weight:300; letter-spacing:1px; }
        .login-box .sub { text-align:center; color:#6a72a0; font-size:14px; margin-bottom:24px; }
        .login-box input {
            width:100%; padding:12px 16px; margin-bottom:16px; background:#12131c; border:1px solid #2a2b3d;
            border-radius:10px; color:#e0e0e0; font-size:16px; outline:none; transition:border 0.2s;
        }
        .login-box input:focus { border-color:#6a8cff; }
        .login-box .btn {
            width:100%; padding:12px; border:none; border-radius:10px; font-size:16px; font-weight:600;
            cursor:pointer; transition:0.2s; margin-bottom:10px;
        }
        .btn-primary { background:linear-gradient(135deg, #6a8cff, #a78bfa); color:#fff; }
        .btn-primary:hover { transform:scale(1.02); box-shadow:0 0 20px rgba(106,140,255,0.3); }
        .btn-secondary { background:#2a2b3d; color:#c0c0d0; }
        .btn-secondary:hover { background:#3a3b4d; }
        .login-error { color:#ff6b6b; font-size:14px; text-align:center; margin-top:8px; min-height:20px; }
        .login-switch { text-align:center; margin-top:12px; font-size:14px; color:#6a72a0; cursor:pointer; }
        .login-switch span { color:#6a8cff; text-decoration:underline; }
        #chatApp { display:flex; height:100vh; width:100%; }
        #chatApp.hidden { display:none; }
        #sidebar { width:260px; background:#14151f; border-right:1px solid #1f2030; padding:16px; display:flex; flex-direction:column; flex-shrink:0; }
        #sidebar .brand { font-size:24px; font-weight:700; background:linear-gradient(135deg,#00e5ff,#ff33cc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:16px; }
        #sidebar .user-info { color:#6a72a0; font-size:14px; margin-bottom:12px; border-bottom:1px solid #1f2030; padding-bottom:12px; }
        #sidebar .user-info .logout { color:#ff6b6b; cursor:pointer; float:right; font-weight:600; }
        #sidebar .user-info .logout:hover { text-decoration:underline; }
        #newChatBtn { background:#6a8cff; border:none; color:#fff; padding:10px; border-radius:10px; font-weight:600; cursor:pointer; margin-bottom:16px; transition:0.2s; }
        #newChatBtn:hover { background:#7a9cff; transform:scale(1.02); }
        #chatList { flex:1; overflow-y:auto; list-style:none; }
        #chatList li {
            padding:8px 12px; border-radius:8px; margin-bottom:2px; cursor:pointer; transition:0.2s;
            color:#c0c0d0; font-size:14px; display:flex; justify-content:space-between; align-items:center;
        }
        #chatList li:hover { background:#1e1f2e; }
        #chatList li.active { background:#2a2b3d; color:#fff; font-weight:500; }
        #chatList li .delete-btn {
            color:#ff6b6b; cursor:pointer; font-size:16px; padding:0 4px; opacity:0;
            transition:opacity 0.2s;
        }
        #chatList li:hover .delete-btn { opacity:1; }
        #chatList li .delete-btn:hover { color:#ff0000; transform:scale(1.2); }
        #main { flex:1; display:flex; flex-direction:column; background:#0b0d15; min-width:0; }
        #messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
        .msg { max-width:80%; padding:12px 18px; border-radius:18px; line-height:1.5; word-wrap:break-word; animation:fadeIn 0.3s; }
        .msg.user { align-self:flex-end; background:#2a2b3d; border-bottom-right-radius:4px; }
        .msg.aura { align-self:flex-start; background:#1e1f2e; border-bottom-left-radius:4px; border:1px solid #2a2b3d; }
        .msg .time { font-size:11px; color:#6a72a0; margin-top:4px; text-align:right; }
        .typing { align-self:flex-start; background:#1e1f2e; padding:12px 18px; border-radius:18px; border-bottom-left-radius:4px; border:1px solid #2a2b3d; color:#6a72a0; font-style:italic; animation:typingPulse 1s infinite alternate; }
        @keyframes typingPulse { 0% { opacity:0.5; } 100% { opacity:1; } }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        #inputArea { display:flex; gap:10px; padding:16px; background:#14151f; border-top:1px solid #1f2030; align-items:center; flex-wrap:wrap; }
        #userInput { flex:1; padding:12px 16px; border-radius:24px; border:1px solid #2a2b3d; background:#0b0d15; color:#e0e0e0; font-size:16px; outline:none; min-width:150px; }
        #userInput:focus { border-color:#6a8cff; }
        .input-btn { background:#2a2b3d; border:none; border-radius:50%; width:44px; height:44px; color:#c0c0d0; font-size:20px; cursor:pointer; transition:0.2s; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .input-btn:hover { background:#3a3b4d; color:#fff; }
        .input-btn.send { background:linear-gradient(135deg,#6a8cff,#a78bfa); color:#fff; }
        .input-btn.send:hover { transform:scale(1.05); box-shadow:0 0 20px rgba(106,140,255,0.3); }
        .input-btn.voice { background:#2a2b3d; color:#a78bfa; }
        .input-btn.voice.recording { background:#ff6b6b; color:#fff; animation:pulse 1s infinite; }
        @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(255,107,107,0.7); } 100% { box-shadow:0 0 0 15px rgba(255,107,107,0); } }
        .input-btn.image { background:#2a2b3d; color:#6a8cff; }
        #imageInput { display:none; }
        .code-section { display:flex; gap:8px; align-items:center; padding:0 8px; }
        .code-section input { background:#0b0d15; border:1px solid #2a2b3d; border-radius:20px; padding:6px 12px; color:#e0e0e0; font-size:13px; width:100px; outline:none; }
        .code-section input:focus { border-color:#6a8cff; }
        .code-status { font-size:12px; color:#6a72a0; }
        .code-status.active { color:#51cf66; }
        .code-status.expired { color:#ff6b6b; }
        @media (max-width:600px) { #sidebar { position:fixed; top:0; left:-280px; width:280px; height:100%; transition:0.3s; z-index:500; } #sidebar.open { left:0; } #overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:400; } #overlay.active { display:block; } #menuBtn { display:block; } }
        #menuBtn { display:none; background:none; border:none; color:#e0e0e0; font-size:24px; cursor:pointer; padding:0 8px; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>🔐 Aura</h2>
        <div class="sub">Login or create an account</div>
        <form id="loginForm">
            <input type="text" id="loginUsername" placeholder="Username" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit" class="btn btn-primary">Login</button>
            <div class="login-error" id="loginError"></div>
            <div class="login-switch">Don't have an account? <span id="switchToRegister">Register</span></div>
        </form>
        <form id="registerForm" style="display:none;">
            <input type="text" id="regUsername" placeholder="Choose username" required>
            <input type="password" id="regPassword" placeholder="Choose password" required>
            <button type="submit" class="btn btn-primary">Register</button>
            <div class="login-error" id="regError"></div>
            <div class="login-switch">Already have an account? <span id="switchToLogin">Login</span></div>
        </form>
    </div>
</div>

<div id="chatApp" class="hidden">
    <div id="sidebar">
        <div class="brand">✦ Aura</div>
        <div class="user-info">
            <span id="userDisplay">User</span>
            <span class="logout" id="logoutBtn">Logout</span>
        </div>
        <button id="newChatBtn">+ New Chat</button>
        <ul id="chatList"></ul>
    </div>
    <div id="main">
        <div style="display:flex; align-items:center; padding:12px 20px; background:#14151f; border-bottom:1px solid #1f2030;">
            <button id="menuBtn">☰</button>
            <span style="margin-left:12px; font-weight:500;">Chat</span>
        </div>
        <div id="messages"></div>
        <div id="inputArea">
            <button class="input-btn image" id="imageBtn" title="Upload image">🖼</button>
            <input type="file" id="imageInput" accept="image/*">
            <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
            <button class="input-btn voice" id="voiceBtn" title="Voice input">🎤</button>
            <div class="code-section">
                <input type="text" id="codeInput" placeholder="Code" maxlength="30">
                <span class="code-status" id="codeStatus"></span>
            </div>
            <button class="input-btn send" id="sendBtn">➤</button>
        </div>
    </div>
</div>
<div id="overlay"></div>

<script>
    // ---------- AUTH ----------
    const STORAGE_TOKEN = 'auraToken';
    const STORAGE_USER = 'auraUser';

    let token = localStorage.getItem(STORAGE_TOKEN);
    let currentUser = localStorage.getItem(STORAGE_USER) || null;

    const loginOverlay = document.getElementById('loginOverlay');
    const chatApp = document.getElementById('chatApp');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginError = document.getElementById('loginError');
    const regError = document.getElementById('regError');
    const userDisplay = document.getElementById('userDisplay');

    document.getElementById('switchToRegister').addEventListener('click', () => {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        loginError.textContent = '';
        regError.textContent = '';
    });
    document.getElementById('switchToLogin').addEventListener('click', () => {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        loginError.textContent = '';
        regError.textContent = '';
    });

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!username || !password) { loginError.textContent = 'Please fill all fields'; return; }
        loginError.textContent = 'Logging in...';
        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                token = data.token;
                currentUser = data.username;
                localStorage.setItem(STORAGE_TOKEN, token);
                localStorage.setItem(STORAGE_USER, currentUser);
                loginError.textContent = '';
                showChat();
            } else {
                loginError.textContent = data.error || 'Login failed';
            }
        } catch (e) {
            loginError.textContent = 'Network error';
        }
    });

    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        if (!username || !password) { regError.textContent = 'Please fill all fields'; return; }
        regError.textContent = 'Creating account...';
        try {
            const res = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                regError.textContent = 'Account created! Please login.';
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                document.getElementById('loginUsername').value = username;
                document.getElementById('loginPassword').value = '';
                loginError.textContent = 'Account created, please login.';
                regError.textContent = '';
            } else {
                regError.textContent = data.error || 'Registration failed';
            }
        } catch (e) {
            regError.textContent = 'Network error';
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem(STORAGE_TOKEN);
        localStorage.removeItem(STORAGE_USER);
        token = null;
        currentUser = null;
        location.reload();
    });

    async function verifyToken() {
        if (!token) return false;
        try {
            const res = await fetch('/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token })
            });
            const data = await res.json();
            if (data.valid) {
                currentUser = data.username;
                localStorage.setItem(STORAGE_USER, currentUser);
                return true;
            } else {
                localStorage.removeItem(STORAGE_TOKEN);
                localStorage.removeItem(STORAGE_USER);
                token = null;
                currentUser = null;
                return false;
            }
        } catch (e) {
            return false;
        }
    }

    function showChat() {
        loginOverlay.classList.add('hidden');
        chatApp.classList.remove('hidden');
        userDisplay.textContent = currentUser || 'User';
        initChat();
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const valid = await verifyToken();
        if (valid && token) {
            showChat();
        } else {
            loginOverlay.classList.remove('hidden');
            chatApp.classList.add('hidden');
        }
    });

    // ---------- CHAT UI ----------
    let currentSessionId = null;
    let currentMessages = [];
    let conversationHistory = [];
    let sessions = [];
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];

    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const chatList = document.getElementById('chatList');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuBtn = document.getElementById('menuBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const imageBtn = document.getElementById('imageBtn');
    const imageInput = document.getElementById('imageInput');
    const codeInput = document.getElementById('codeInput');
    const codeStatus = document.getElementById('codeStatus');

    const STORAGE_SESSIONS = 'auraSessions';
    const STORAGE_CODE = 'auraCode';
    const STORAGE_CODE_TIME = 'auraCodeTime';

    let currentImageBase64 = null;

    function loadSessions() {
        try {
            const data = localStorage.getItem(STORAGE_SESSIONS);
            if (data) sessions = JSON.parse(data);
            else sessions = [];
        } catch (e) { sessions = []; }
    }

    function saveSessions() {
        localStorage.setItem(STORAGE_SESSIONS, JSON.stringify(sessions));
    }

    function createSession(title) {
        const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
        return { id, title, messages: [], timestamp: Date.now() };
    }

    function saveCurrentSession() {
        if (!currentSessionId) return;
        const session = sessions.find(s => s.id === currentSessionId);
        if (session) {
            session.messages = currentMessages.slice();
            session.timestamp = Date.now();
            if (session.title === 'New Chat' && currentMessages.length > 0) {
                const firstUser = currentMessages.find(m => m.role === 'user');
                if (firstUser) {
                    session.title = firstUser.text.slice(0, 30) + (firstUser.text.length > 30 ? '...' : '');
                }
            }
            saveSessions();
        }
    }

    function deleteSession(id) {
        if (!confirm('Delete this chat?')) return;
        sessions = sessions.filter(s => s.id !== id);
        if (sessions.length === 0) {
            const session = createSession('New Chat');
            sessions.push(session);
        }
        if (currentSessionId === id) {
            const latest = sessions[0];
            currentSessionId = latest.id;
            currentMessages = latest.messages ? latest.messages.slice() : [];
            conversationHistory = [];
            currentMessages.forEach(msg => {
                if (msg.role === 'user') conversationHistory.push({ role: 'user', content: msg.text });
                else if (msg.role === 'aura') conversationHistory.push({ role: 'assistant', content: msg.text });
            });
            userInput.placeholder = latest.title === 'New Chat' ? 'Talk to Aura...' : 'Continue chat...';
        }
        saveSessions();
        renderChatList();
        renderMessages();
    }

    function renderMessages() {
        messagesDiv.innerHTML = '';
        currentMessages.forEach((msg) => {
            const div = document.createElement('div');
            div.className = 'msg ' + msg.role;
            div.textContent = msg.text;
            const time = document.createElement('div');
            time.className = 'time';
            time.textContent = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : '';
            div.appendChild(time);
            messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function renderChatList() {
        chatList.innerHTML = '';
        sessions.forEach(s => {
            const li = document.createElement('li');
            const span = document.createElement('span');
            span.textContent = s.title || 'Chat';
            li.appendChild(span);
            const del = document.createElement('span');
            del.className = 'delete-btn';
            del.textContent = '✕';
            del.title = 'Delete chat';
            del.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteSession(s.id);
            });
            li.appendChild(del);
            if (s.id === currentSessionId) li.classList.add('active');
            li.addEventListener('click', () => switchSession(s.id));
            chatList.appendChild(li);
        });
    }

    function switchSession(id) {
        saveCurrentSession();
        const session = sessions.find(s => s.id === id);
        if (!session) return;
        currentSessionId = session.id;
        currentMessages = session.messages ? session.messages.slice() : [];
        conversationHistory = [];
        currentMessages.forEach(msg => {
            if (msg.role === 'user') conversationHistory.push({ role: 'user', content: msg.text });
            else if (msg.role === 'aura') conversationHistory.push({ role: 'assistant', content: msg.text });
        });
        renderMessages();
        renderChatList();
        userInput.placeholder = session.title === 'New Chat' ? 'Talk to Aura...' : 'Continue chat...';
        if (window.innerWidth <= 600) { sidebar.classList.remove('open'); overlay.classList.remove('active'); }
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text && !currentImageBase64) return;
        const userMsg = text || 'Describe this image';
        currentMessages.push({ role: 'user', text: userMsg, timestamp: Date.now() });
        conversationHistory.push({ role: 'user', content: userMsg });
        renderMessages();
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;

        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing';
        typingDiv.textContent = 'Aura is thinking...';
        messagesDiv.appendChild(typingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        const body = {
            chat: userMsg,
            history: conversationHistory,
            token: token
        };
        if (currentImageBase64) {
            body.image = currentImageBase64;
            currentImageBase64 = null;
        }
        const code = localStorage.getItem(STORAGE_CODE);
        const activated = parseInt(localStorage.getItem(STORAGE_CODE_TIME) || '0');
        if (code && activated) {
            body.code = code;
            body.activated = activated;
        }

        try {
            const resp = await fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await resp.json();
            if (data.needAuth) {
                localStorage.removeItem(STORAGE_TOKEN);
                localStorage.removeItem(STORAGE_USER);
                token = null;
                currentUser = null;
                location.reload();
                return;
            }
            if (data.response) {
                finalizeReply(typingDiv, data.response);
            } else {
                finalizeReply(typingDiv, data.error || 'Server error.');
            }
            if (data.codeError) {
                codeStatus.textContent = '❌ ' + data.codeError;
                codeStatus.className = 'code-status expired';
                if (data.codeError.includes('expired') || data.codeError.includes('invalid')) {
                    localStorage.removeItem(STORAGE_CODE);
                    localStorage.removeItem(STORAGE_CODE_TIME);
                    updateCodeStatus();
                }
            }
        } catch (e) {
            finalizeReply(typingDiv, 'Error: ' + e.message);
        }

        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
    }

    function finalizeReply(typingDiv, replyText) {
        typingDiv.remove();
        currentMessages.push({ role: 'aura', text: replyText, timestamp: Date.now() });
        conversationHistory.push({ role: 'assistant', content: replyText });
        renderMessages();
        saveCurrentSession();
        renderChatList();
    }

    function updateCodeStatus() {
        const code = localStorage.getItem(STORAGE_CODE);
        const activated = parseInt(localStorage.getItem(STORAGE_CODE_TIME) || '0');
        if (code && activated) {
            const diff = Date.now() - activated;
            if (diff > 0 && diff < 30 * 24 * 60 * 60 * 1000) {
                codeStatus.textContent = '✅ Active';
                codeStatus.className = 'code-status active';
                return;
            } else {
                localStorage.removeItem(STORAGE_CODE);
                localStorage.removeItem(STORAGE_CODE_TIME);
            }
        }
        codeStatus.textContent = '';
        codeStatus.className = 'code-status';
    }

    codeInput.addEventListener('change', () => {
        const val = codeInput.value.trim();
        if (val) {
            localStorage.setItem(STORAGE_CODE, val);
            localStorage.setItem(STORAGE_CODE_TIME, Date.now().toString());
            updateCodeStatus();
            codeInput.value = '';
        }
    });

    voiceBtn.addEventListener('click', async () => {
        if (isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            voiceBtn.classList.remove('recording');
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const formData = new FormData();
                formData.append('audio', blob, 'voice.webm');
                try {
                    const res = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    if (data.text) {
                        userInput.value = data.text;
                        sendMessage();
                    } else {
                        alert('Transcription failed');
                    }
                } catch (e) {
                    alert('Upload error');
                }
                stream.getTracks().forEach(t => t.stop());
            };
            mediaRecorder.start();
            isRecording = true;
            voiceBtn.classList.add('recording');
        } catch (e) {
            alert('Microphone access denied');
        }
    });

    imageBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const base64 = ev.target.result.split(',')[1];
            currentImageBase64 = base64;
            userInput.placeholder = '📷 Image attached. Type a message or send.';
        };
        reader.readAsDataURL(file);
        imageInput.value = '';
    });

    newChatBtn.addEventListener('click', () => {
        saveCurrentSession();
        const session = createSession('New Chat');
        sessions.push(session);
        currentSessionId = session.id;
        currentMessages = [];
        conversationHistory = [];
        renderMessages();
        renderChatList();
        userInput.placeholder = 'Talk to Aura...';
        userInput.focus();
        saveSessions();
        if (window.innerWidth <= 600) { sidebar.classList.remove('open'); overlay.classList.remove('active'); }
    });

    menuBtn.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
    });
    overlay.addEventListener('click', () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
    });

    function initChat() {
        loadSessions();
        if (sessions.length === 0) {
            const session = createSession('New Chat');
            sessions.push(session);
            currentSessionId = session.id;
            currentMessages = [];
            conversationHistory = [];
        } else {
            const latest = sessions[0];
            currentSessionId = latest.id;
            currentMessages = latest.messages ? latest.messages.slice() : [];
            conversationHistory = [];
            currentMessages.forEach(msg => {
                if (msg.role === 'user') conversationHistory.push({ role: 'user', content: msg.text });
                else if (msg.role === 'aura') conversationHistory.push({ role: 'assistant', content: msg.text });
            });
            userInput.placeholder = latest.title === 'New Chat' ? 'Talk to Aura...' : 'Continue chat...';
        }
        renderMessages();
        renderChatList();
        updateCodeStatus();

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
        userInput.focus();

        window.addEventListener('beforeunload', () => { saveCurrentSession(); });
    }

    // ---- Online client ping ----
    async function sendOnlinePing() {
        try {
            const info = {
                clientName: navigator.userAgent + ' | ' + screen.width + 'x' + screen.height + ' | ' + (navigator.language || 'en')
            };
            await fetch('/client-ping', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(info)
            });
            console.log('✅ Ping sent to server');
        } catch (e) {
            console.log('⚠️ Ping failed (server might be local only)');
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', sendOnlinePing);
    } else {
        sendOnlinePing();
    }

    const originalShowChat = showChat;
    showChat = function() {
        originalShowChat();
        fetch('/client-ping', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ clientName: `Logged in: ${currentUser} (${navigator.userAgent})` })
        }).catch(() => {});
    };

</script>
</body>
</html>
