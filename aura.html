<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Tahoma,sans-serif; background:#0b0d15; color:#e0e0e0; height:100vh; display:flex; justify-content:center; align-items:center; padding:10px; }
        .container { max-width:700px; width:100%; height:100%; max-height:800px; background:#141824; border-radius:24px; padding:16px; box-shadow:0 20px 60px rgba(0,0,0,0.8); border:1px solid #2a2f45; display:flex; flex-direction:column; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #2a2f45; padding-bottom:10px; flex-shrink:0; }
        .header .logo { display:flex; align-items:center; gap:12px; }
        .header .logo .avatar { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#a78bfa,#6a8cff); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:22px; color:#fff; box-shadow:0 0 20px rgba(167,139,250,0.4); animation:pulse 2s infinite ease-in-out; user-select:none; }
        @keyframes pulse { 0% { box-shadow:0 0 20px rgba(167,139,250,0.4); } 50% { box-shadow:0 0 40px rgba(167,139,250,0.8); } 100% { box-shadow:0 0 20px rgba(167,139,250,0.4); } }
        .header .logo .name { font-size:22px; font-weight:700; background:linear-gradient(135deg,#a78bfa,#6a8cff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:-0.5px; }
        .chat-box { background:#0f1322; border-radius:16px; padding:12px; flex:1; overflow-y:auto; margin-bottom:12px; border:1px solid #1e2438; min-height:200px; }
        .chat-box::-webkit-scrollbar { width:5px; }
        .chat-box::-webkit-scrollbar-track { background:#0f1322; }
        .chat-box::-webkit-scrollbar-thumb { background:#2a2f45; border-radius:10px; }
        .message { margin-bottom:10px; display:flex; align-items:flex-start; gap:8px; }
        .message.user { flex-direction:row-reverse; }
        .message .avatar { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; }
        .message.aura .avatar { background:linear-gradient(135deg,#a78bfa,#6a8cff); color:#fff; box-shadow:0 0 10px rgba(167,139,250,0.3); }
        .message.user .avatar { background:#2a3050; color:#d0d4e8; }
        .message .bubble { max-width:80%; padding:8px 14px; border-radius:16px; font-size:15px; line-height:1.5; background:#1a1f33; border:1px solid #262b44; word-wrap:break-word; }
        .message.user .bubble { background:#2a3050; border-color:#3a4060; }
        .message.typing .bubble { color:#6a72a0; font-style:italic; }
        .input-area { display:flex; gap:10px; flex-shrink:0; }
        .input-area input { flex:1; background:#0f1322; border:1px solid #1e2438; border-radius:30px; padding:12px 16px; color:#d0d4e8; font-size:16px; outline:none; min-height:48px; }
        .input-area input:focus { border-color:#4a507a; }
        .input-area input::placeholder { color:#5a6080; }
        .input-area button { background:#2a3050; border:none; border-radius:30px; padding:12px 24px; color:#d0d4e8; font-size:16px; cursor:pointer; border:1px solid #3a4060; transition:0.2s; min-height:48px; white-space:nowrap; flex-shrink:0; }
        .input-area button:hover { background:#3a4060; }
        .input-area button:disabled { opacity:0.5; cursor:not-allowed; }
        @media (max-width:480px) { .container { padding:12px; border-radius:16px; } .header .logo .name { font-size:18px; } .input-area input { font-size:14px; padding:10px 14px; } .input-area button { font-size:14px; padding:10px 16px; } .message .bubble { font-size:14px; padding:6px 12px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">
            <div class="avatar">A</div>
            <span class="name">Aura</span>
        </div>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="message aura">
            <div class="avatar">A</div>
            <div class="bubble">Hi, I'm Aura. Ask me anything.</div>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Talk to Aura..." autofocus>
        <button id="sendBtn">Send</button>
    </div>
</div>
<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'message ' + role;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? 'U' : 'A';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        div.appendChild(avatar);
        div.appendChild(bubble);
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    function updateTyping(div, text) {
        div.querySelector('.bubble').textContent = text;
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;

        appendMessage('user', text);

        const typingDiv = appendMessage('aura', '🤔 Thinking...');
        typingDiv.classList.add('typing');

        try {
            const resp = await fetch('/?chat=' + encodeURIComponent(text));
            const data = await resp.json();
            if (data.response) {
                updateTyping(typingDiv, data.response);
            } else {
                updateTyping(typingDiv, '⚠️ No response.');
            }
        } catch (e) {
            updateTyping(typingDiv, '⚠️ Unable to connect.');
        }

        typingDiv.classList.remove('typing');
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
    userInput.focus();
</script>
</body>
</html>
