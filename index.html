<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Aura Works</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0b0d15;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 700px; }
        .logo {
            font-size: 80px;
            font-weight: 900;
            background: linear-gradient(135deg, #00e5ff, #ff33cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }
        .sub {
            font-size: 24px;
            color: #6a72a0;
            margin-bottom: 40px;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .btn {
            display: inline-block;
            padding: 16px 48px;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #6a8cff, #a78bfa);
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 30px rgba(106, 140, 255, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(106, 140, 255, 0.5);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
        }
        .btn-secondary:hover {
            box-shadow: 0 0 50px rgba(255, 107, 107, 0.5);
        }
        .loading { color: #6a72a0; font-size: 18px; margin-top: 20px; }
        .note {
            font-size: 14px;
            color: #4a507a;
            margin-top: 20px;
        }
        .note span { color: #6a72a0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Aura</div>
        <div class="sub">Your AI companion</div>
        <div class="btn-group">
            <button class="btn" id="fastBtn">🚀 Aura (Fast)</button>
            <a href="https://aura-r0y6.onrender.com/?page=aura" class="btn btn-secondary">🔄 Aura (Backup)</a>
        </div>
        <div class="loading" id="loadingMsg">Checking for fast tunnel...</div>
        <div class="note">⚡ Fast = your PC (low latency) | 🔄 Backup = cloud (always online)</div>
    </div>
    <script>
        // ---- SHA‑free Gist URL ----
        const GIST_URL = 'https://gist.githubusercontent.com/theyabknown-bit/6b6904a28a45cd06ddff08714119860e/raw/gistfile1.txt?t=' + Date.now();
        const BACKUP_URL = 'https://aura-r0y6.onrender.com/?page=aura';

        let tunnelUrl = null;
        let fallbackTimer = null;

        function goToBackup() {
            window.location.href = BACKUP_URL;
        }

        async function fetchTunnel() {
            try {
                const resp = await fetch(GIST_URL);
                const data = await resp.json();
                if (data && data.tunnel) {
                    tunnelUrl = data.tunnel;
                    document.getElementById('loadingMsg').textContent = '✅ Fast tunnel ready! Click the button.';
                    document.getElementById('fastBtn').disabled = false;
                    document.getElementById('fastBtn').style.opacity = 1;
                    return;
                }
            } catch (e) {
                console.warn('Gist fetch failed, using fallback.', e);
            }
            // Fallback to hardcoded URL if Gist fails
            tunnelUrl = 'https://super-sea-07vkt.trybore.com';
            document.getElementById('loadingMsg').textContent = '⚠️ Using fallback tunnel (may be outdated).';
            document.getElementById('fastBtn').disabled = false;
            document.getElementById('fastBtn').style.opacity = 1;
        }

        function tryFast() {
            if (!tunnelUrl) {
                alert('Tunnel URL not yet loaded. Please wait.');
                return;
            }

            // Show that we're trying
            document.getElementById('loadingMsg').textContent = '⏳ Connecting to fast tunnel...';

            // Try to fetch the tunnel URL with a short timeout
            // If it doesn't respond in 3 seconds, go to backup
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 3000);

            fetch(tunnelUrl + '/?page=aura', {
                method: 'HEAD',
                mode: 'no-cors', // we just want to see if it responds
                signal: controller.signal
            })
            .then(() => {
                // If we get here, it's reachable
                clearTimeout(timeoutId);
                window.location.href = tunnelUrl + '/?page=aura';
            })
            .catch(() => {
                // If it fails or times out, go to backup
                clearTimeout(timeoutId);
                document.getElementById('loadingMsg').textContent = '⚠️ Fast tunnel unavailable. Redirecting to backup...';
                setTimeout(goToBackup, 1000);
            });

            // Also set a safety timeout: if we don't get a response in 4 seconds, force backup
            setTimeout(() => {
                if (!window.location.href.includes('aura-r0y6')) {
                    // Only if we haven't already redirected
                    document.getElementById('loadingMsg').textContent = '⏳ Fast tunnel timeout. Redirecting to backup...';
                    setTimeout(goToBackup, 500);
                }
            }, 4000);
        }

        document.getElementById('fastBtn').addEventListener('click', tryFast);

        document.getElementById('fastBtn').disabled = true;
        document.getElementById('fastBtn').style.opacity = 0.5;

        fetchTunnel();
    </script>
</body>
</html>
