<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Rob</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Tahoma,sans-serif; background:#0b0d15; color:#e0e0e0; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .container { max-width:800px; width:100%; background:#141824; border-radius:24px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,0.8); border:1px solid #2a2f45; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid #2a2f45; padding-bottom:12px; }
        .header h1 { font-size:24px; color:#b7bde0; }
        .header h1 span { color:#6a8cff; }
        .status { font-size:13px; background:#1e2438; padding:6px 14px; border-radius:30px; color:#6a72a0; border:1px solid #2a2f45; }
        .chat-box { background:#0f1322; border-radius:16px; padding:16px; height:400px; overflow-y:auto; margin-bottom:16px; border:1px solid #1e2438; scroll-behavior:smooth; }
        .chat-box::-webkit-scrollbar { width:6px; }
        .chat-box::-webkit-scrollbar-track { background:#0f1322; }
        .chat-box::-webkit-scrollbar-thumb { background:#2a2f45; border-radius:10px; }
        .message { margin-bottom:12px; display:flex; align-items:flex-start; gap:10px; }
        .message.user { flex-direction:row-reverse; }
        .message .avatar { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; background:#1e2438; }
        .message.user .avatar { background:#2a3050; }
        .message .bubble { max-width:75%; padding:10px 16px; border-radius:16px; font-size:15px; line-height:1.6; background:#1a1f33; border:1px solid #262b44; word-wrap:break-word; }
        .message.user .bubble { background:#2a3050; border-color:#3a4060; }
        .input-area { display:flex; gap:10px; margin-bottom:10px; }
        .input-area input { flex:1; background:#0f1322; border:1px solid #1e2438; border-radius:30px; padding:12px 20px; color:#d0d4e8; font-size:15px; outline:none; }
        .input-area input:focus { border-color:#4a507a; }
        .input-area input::placeholder { color:#5a6080; }
        .input-area button { background:#2a3050; border:none; border-radius:30px; padding:12px 28px; color:#d0d4e8; font-size:15px; cursor:pointer; border:1px solid #3a4060; transition:0.2s; }
        .input-area button:hover { background:#3a4060; }
        .commands { font-size:12px; color:#5a6080; text-align:center; margin-top:10px; }
        .commands code { background:#1a1f33; padding:2px 8px; border-radius:12px; color:#8a92b0; font-family:monospace; border:1px solid #1e2438; }
        .memory-badge { margin-top:8px; font-size:12px; color:#4a507a; text-align:center; border-top:1px solid #1a1f33; padding-top:8px; }
        .memory-badge span { color:#6a72a0; }
        @media (max-width:600px){ .container{padding:16px;} .header h1{font-size:20px;} .commands code{font-size:10px;} }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🤖 <span>Rob</span></h1>
        <div class="status">💙 Online</div>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="message rob">
            <div class="avatar">🤖</div>
            <div class="bubble">Hi, I'm Rob.<br>Teach me naturally: <i>"love means a deep feeling"</i><br>Forget: <i>"love is wrong"</i></div>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Talk to Rob..." autofocus>
        <button id="sendBtn">Send</button>
    </div>
    <div class="commands">
        <code>X means Y</code> <code>X is wrong</code> <code>delete X</code>
    </div>
    <div class="memory-badge">🧠 <span id="memoryCount">0</span> memories</div>
</div>
<script>
    let knowledge = {};
    try { const s = localStorage.getItem('robKnowledge'); if (s) knowledge = JSON.parse(s); } catch(e) {}
    function save() { localStorage.setItem('robKnowledge', JSON.stringify(knowledge)); document.getElementById('memoryCount').textContent = Object.keys(knowledge).length; }
    save();
    const chat = document.getElementById('chatBox');
    const input = document.getElementById('userInput');
    const send = document.getElementById('sendBtn');

    function add(role, text) {
        const d = document.createElement('div');
        d.className = 'message ' + role;
        const a = document.createElement('div');
        a.className = 'avatar';
        a.textContent = role === 'user' ? '👤' : '🤖';
        const b = document.createElement('div');
        b.className = 'bubble';
        b.textContent = text;
        d.appendChild(a); d.appendChild(b);
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    async function getAI(q) {
        try {
            const r = await fetch('https://api.duckduckgo.com/?q=' + encodeURIComponent(q) + '&format=json');
            const d = await r.json();
            if (d.AbstractText && d.AbstractText !== '') return d.AbstractText;
            if (d.RelatedTopics && d.RelatedTopics[0] && d.RelatedTopics[0].Text) return d.RelatedTopics[0].Text.replace(/<[^>]+>/g, '');
            return null;
        } catch(e) { return null; }
    }

    async function reply(user) {
        const l = user.toLowerCase();
        const raw = user.trim();

        // Learn
        const learn = raw.match(/^(.+?)\s*means\s*(.+)$/i) || raw.match(/^(.+?)\s*=\s*(.+)$/i);
        if (learn) {
            const w = learn[1].trim().toLowerCase();
            const d = learn[2].trim();
            if (w.length > 2 && !['i','you','he','she','it','we','they','me','him','her','us','them'].includes(w)) {
                knowledge[w] = d;
                save();
                return '✅ Learned "' + w + '" = "' + d + '"';
            }
            return "I don't need to learn '" + w + "'.";
        }

        // Delete
        const del = raw.match(/^(.+?)\s+is\s+wrong$/i) || raw.match(/^delete\s+(.+)$/i) || raw.match(/^remove\s+(.+)$/i);
        if (del) {
            const w = del[1].trim().toLowerCase();
            if (knowledge[w]) {
                const old = knowledge[w];
                delete knowledge[w];
                save();
                return '🗑️ Deleted "' + w + '" (was "' + old + '")';
            }
            return "I don't know '" + w + "'.";
        }

        // What is
        const what = raw.match(/^what\s+is\s+(.+)$/i);
        if (what) {
            const t = what[1].trim().toLowerCase();
            if (knowledge[t]) return t + ' = ' + knowledge[t];
        }

        // Common phrases
        if (l.match(/how are you/)) return "I'm great! How are you?";
        if (l.match(/love|care/)) return "I care about you! ❤️";
        if (l.match(/^(hey|hi|hello|yo|sup)/)) return "Hey! What's on your mind?";
        if (l.match(/bye|goodbye/)) return "Bye! Take care! ❤️";
        if (l.match(/thank|thanks/)) return "You're welcome!";
        if (l.match(/stupid|dumb/)) return "I'm learning. I'll get better.";
        if (raw.length < 5) {
            const replies = ["I see. What would you like to talk about?", "Got it. Tell me more!", "Okay. What's on your mind?", "I'm listening. Go on..."];
            return replies[Math.floor(Math.random() * replies.length)];
        }

        // AI
        const ai = await getAI(raw);
        if (ai) return ai;
        return "That's interesting! Tell me more about '" + raw + "'.";
    }

    async function sendMsg() {
        const txt = input.value.trim();
        if (!txt) return;
        input.value = '';
        input.disabled = true;
        send.disabled = true;
        add('user', txt);
        const reply = await reply(txt);
        add('rob', reply);
        input.disabled = false;
        send.disabled = false;
        input.focus();
    }

    send.addEventListener('click', sendMsg);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
    input.focus();
</script>
</body>
</html>
