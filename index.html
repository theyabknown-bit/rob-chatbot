<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Aura Works</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0b0d15;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 700px; }
        .logo {
            font-size: 80px;
            font-weight: 900;
            background: linear-gradient(135deg, #00e5ff, #ff33cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }
        .sub { font-size: 24px; color: #6a72a0; margin-bottom: 40px; }
        .btn {
            display: inline-block;
            padding: 16px 48px;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #6a8cff, #a78bfa);
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 30px rgba(106, 140, 255, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(106, 140, 255, 0.5); }
        .loading { color: #6a72a0; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Aura</div>
        <div class="sub">Your AI companion</div>
        <button class="btn" id="enterBtn">Enter Aura</button>
        <div class="loading" id="loadingMsg">Checking servers...</div>
    </div>
    <script>
        const GIST_URL = 'https://gist.githubusercontent.com/theyabknown-bit/6b6904a28a45cd06ddff08714119860e/raw/gistfile1.txt?t=' + Date.now();
        const RENDER_URL = 'https://aura-r0y6.onrender.com';
        let finalUrl = RENDER_URL; // default to Render

        async function testTunnel(url) {
            try {
                // Try to fetch the main page with a short timeout
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 3000);
                const resp = await fetch(url + '/?page=aura', {
                    method: 'HEAD',
                    signal: controller.signal
                });
                clearTimeout(timeout);
                return resp.ok;
            } catch (e) {
                return false;
            }
        }

        async function fetchTunnel() {
            document.getElementById('loadingMsg').textContent = 'Fetching tunnel...';
            try {
                const resp = await fetch(GIST_URL);
                if (!resp.ok) throw new Error('Gist fetch failed');
                const text = await resp.text();
                const data = JSON.parse(text);
                if (data && data.tunnel) {
                    const tunnelUrl = data.tunnel;
                    document.getElementById('loadingMsg').textContent = 'Testing tunnel...';
                    const alive = await testTunnel(tunnelUrl);
                    if (alive) {
                        finalUrl = tunnelUrl;
                        document.getElementById('loadingMsg').textContent = '✅ Tunnel available!';
                    } else {
                        document.getElementById('loadingMsg').textContent = '⚠️ Tunnel down, using Render backup.';
                    }
                } else {
                    document.getElementById('loadingMsg').textContent = 'No tunnel in Gist, using Render.';
                }
            } catch (e) {
                console.warn('Gist failed, using Render:', e);
                document.getElementById('loadingMsg').textContent = '⚠️ Using Render backup.';
            }
            // Enable the button
            document.getElementById('enterBtn').disabled = false;
            document.getElementById('enterBtn').style.opacity = 1;
        }

        document.getElementById('enterBtn').addEventListener('click', () => {
            if (finalUrl) {
                window.location.href = finalUrl + '/?page=aura&v=' + Date.now();
            } else {
                alert('No server available. Please try again.');
            }
        });

        document.getElementById('enterBtn').disabled = true;
        document.getElementById('enterBtn').style.opacity = 0.5;
        fetchTunnel();
    </script>
</body>
</html>
