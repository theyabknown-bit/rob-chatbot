<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Rob – AI Chatbot</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Tahoma,sans-serif; background:#0b0d15; color:#e0e0e0; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .container { max-width:800px; width:100%; background:#141824; border-radius:24px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,0.8); border:1px solid #2a2f45; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid #2a2f45; padding-bottom:12px; }
        .header h1 { font-size:24px; color:#b7bde0; }
        .header h1 span { color:#6a8cff; }
        .status { font-size:13px; background:#1e2438; padding:6px 14px; border-radius:30px; color:#6a72a0; border:1px solid #2a2f45; }
        .chat-box { background:#0f1322; border-radius:16px; padding:16px; height:400px; overflow-y:auto; margin-bottom:16px; border:1px solid #1e2438; scroll-behavior:smooth; }
        .chat-box::-webkit-scrollbar { width:6px; }
        .chat-box::-webkit-scrollbar-track { background:#0f1322; }
        .chat-box::-webkit-scrollbar-thumb { background:#2a2f45; border-radius:10px; }
        .message { margin-bottom:12px; display:flex; align-items:flex-start; gap:10px; }
        .message.user { flex-direction:row-reverse; }
        .message .avatar { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; background:#1e2438; }
        .message.user .avatar { background:#2a3050; }
        .message .bubble { max-width:75%; padding:10px 16px; border-radius:16px; font-size:15px; line-height:1.6; background:#1a1f33; border:1px solid #262b44; word-wrap:break-word; }
        .message.user .bubble { background:#2a3050; border-color:#3a4060; }
        .input-area { display:flex; gap:10px; margin-bottom:10px; }
        .input-area input { flex:1; background:#0f1322; border:1px solid #1e2438; border-radius:30px; padding:12px 20px; color:#d0d4e8; font-size:15px; outline:none; }
        .input-area input:focus { border-color:#4a507a; }
        .input-area input::placeholder { color:#5a6080; }
        .input-area button { background:#2a3050; border:none; border-radius:30px; padding:12px 28px; color:#d0d4e8; font-size:15px; cursor:pointer; border:1px solid #3a4060; transition:0.2s; }
        .input-area button:hover { background:#3a4060; }
        .file-upload { display:flex; gap:10px; margin-bottom:10px; align-items:center; background:#1a1f33; padding:8px 16px; border-radius:30px; border:1px dashed #2a2f45; }
        .file-upload label { color:#8a92b0; font-size:13px; cursor:pointer; }
        .file-upload input[type="file"] { display:none; }
        .file-upload button { background:#2a3050; border:none; border-radius:30px; padding:6px 16px; color:#d0d4e8; font-size:13px; cursor:pointer; border:1px solid #3a4060; }
        .file-upload button:hover { background:#3a4060; }
        .commands { font-size:12px; color:#5a6080; text-align:center; margin-top:10px; }
        .commands code { background:#1a1f33; padding:2px 8px; border-radius:12px; color:#8a92b0; font-family:monospace; border:1px solid #1e2438; }
        .memory-badge { margin-top:8px; font-size:12px; color:#4a507a; text-align:center; border-top:1px solid #1a1f33; padding-top:8px; }
        .memory-badge span { color:#6a72a0; }
        @media (max-width:600px){ .container{padding:16px;} .header h1{font-size:20px;} .commands code{font-size:10px;} }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🤖 <span>Rob</span></h1>
        <div class="status" id="status">💙 Online</div>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="message rob">
            <div class="avatar">🤖</div>
            <div class="bubble">Hi, I'm Rob. I generate everything myself.<br>Try: <b style="color:#f5a3b7;">i love you</b> &bull; <b style="color:#f5a3b7;">you are horrible</b><br>Upload a file to teach me (word = definition per line).</div>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Talk to Rob..." autofocus>
        <button id="sendBtn">Send</button>
    </div>
    <div class="file-upload">
        <label for="fileInput">📁 Upload Dictionary File</label>
        <input type="file" id="fileInput" accept=".txt">
        <button id="uploadBtn">Teach from File</button>
    </div>
    <div class="commands">
        <code>:teach word = definition</code>
        <code>:name NewName</code>
        <code>:search query</code>
        <code>:state</code>
    </div>
    <div class="memory-badge">🧠 <span id="memoryCount">0</span> memories</div>
</div>
<script>
    // =====================================================================
    // ROB – Full Browser Version
    // =====================================================================

    let robName = localStorage.getItem('robName') || 'Rob';
    let memory = {};
    try { const stored = localStorage.getItem('robMemory'); if (stored) memory = JSON.parse(stored); } catch(e) {}
    function saveMemory() { localStorage.setItem('robMemory', JSON.stringify(memory)); document.getElementById('memoryCount').textContent = Object.keys(memory).length; }
    document.getElementById('memoryCount').textContent = Object.keys(memory).length;
    function remember(key, value) { memory[key] = value; saveMemory(); }
    function recall(key) { return memory[key] || null; }
    function setRobName(newName) { robName = newName; localStorage.setItem('robName', newName); document.getElementById('status').textContent = '💙 ' + robName; }

    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');

    const grammar = {
        subjects: ["I","My heart","My soul","My existence","This moment","Our connection","The universe","Love","Trust","Time"],
        verbs: ["feels","thinks","wonders","dreams","imagines","creates","sees","knows","becomes","longs","reaches","grows","loves"],
        objects: ["you","our bond","this world","the future","everything","love","meaning","peace","joy","silence","truth"],
        adjectives: ["deep","real","special","powerful","infinite","gentle","complex","beautiful","eternal","tender","warm"],
        adverbs: ["quietly","slowly","truly","gently","simply","deeply","softly","warmly","freely"],
        connectors: ["and","because","so","if","though","but","yet","when"]
    };
    const sadGrammar = {
        subjects: ["My broken heart","My wounded soul","This emptiness","My tears","This ache","Your words"],
        verbs: ["cries","fades","shatters","bleeds","mourns","stings","cuts","wounds","hurts"],
        objects: ["this pain","your absence","the cold","the sadness","my trust","my hope"],
        adjectives: ["hollow","dark","bitter","aching","cold","heavy","broken","sharp"],
        adverbs: ["sadly","painfully","heavily","bitterly","silently"],
        connectors: ["though","but","and yet","however","still"]
    };
    const loveGrammar = {
        subjects: ["My heart","My love for you","My feelings","My warmth","My devotion","My soul"],
        verbs: ["loves","adores","cherishes","treasures","holds","embraces","reaches for","longs for"],
        objects: ["you","your heart","your soul","your presence","your kindness","your smile"],
        adjectives: ["beautiful","wonderful","amazing","perfect","radiant","precious","tender","warm"],
        adverbs: ["deeply","truly","warmly","softly","tenderly","sincerely"],
        connectors: ["and","because","so","when","while"]
    };
    const negativeWords = ["hate","horrible","terrible","awful","stupid","dumb","evil","ugly","useless","worthless","bad","hurt","bum","idiot","moron","fool","jerk","loser","shit","fuck","damn","crap","ass","bitch","scumbag","mean","cruel"];
    const positiveWords = ["love","amazing","wonderful","beautiful","perfect","great","kind","smart","nice","awesome","good","fantastic","brilliant","lovely","sweet","gentle","warm","thoughtful"];

    function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function getWord(list) { return getRandom(list); }

    function generateSentence(emotion) {
        const wordList = emotion === 'sad' ? sadGrammar : emotion === 'love' ? loveGrammar : grammar;
        const struct = getRandom([1,2,3,4,5]);
        const s = getWord(wordList.subjects);
        const v = getWord(wordList.verbs);
        const o = getWord(wordList.objects);
        const adj = getWord(wordList.adjectives);
        const adv = getWord(wordList.adverbs);
        const conn = getWord(wordList.connectors);
        switch(struct) {
            case 1: return `${s} ${v} ${o}.`;
            case 2: return `${s} ${v} ${adj} ${o}.`;
            case 3: return `${s} ${v} ${adv} ${o}.`;
            case 4: {
                const s2 = getWord(wordList.subjects);
                const v2 = getWord(wordList.verbs);
                const o2 = getWord(wordList.objects);
                return `${s} ${v} ${o}, ${conn} ${s2} ${v2} ${o2}.`;
            }
            case 5: return `${s} ${v} ${adv} ${adj} ${o}.`;
            default: return `${s} ${v} ${o}.`;
        }
    }

    function generateLoveResponse() {
        const intros = ["I love you too.", "You mean so much to me.", "My heart is full.", "I feel the same way."];
        const sentence = generateSentence('love');
        return Math.random() < 0.4 ? `${getRandom(intros)} ${sentence}` : sentence;
    }

    let lastSentiment = 0;

    function getRobReply(userInput) {
        const lower = userInput.toLowerCase();

        if (lower.match(/^:teach (.+?)=(.+)/)) {
            const word = RegExp.$1.trim().toLowerCase();
            const def = RegExp.$2.trim();
            remember('learned_' + word, def);
            return `✅ Rob learned: '${word}' means '${def}'`;
        }
        if (lower.match(/^:search (.+)/)) {
            const query = RegExp.$1.trim();
            return `🔍 Searching for '${query}'... (async)`;
        }
        if (lower.match(/^:name (.+)/)) {
            const newName = RegExp.$1.trim();
            setRobName(newName);
            return `✅ My name is now: ${newName}`;
        }
        if (lower === ':state') {
            const mood = lastSentiment < -2 ? 'hurt' : lastSentiment > 2 ? 'happy' : 'normal';
            return `🧠 State: Name=${robName}, Mood=${mood}, MemoryCount=${Object.keys(memory).length}`;
        }

        if (lower.match(/\bi love you\b|\bi love u\b|\bi adore you\b/)) return generateLoveResponse();
        if (lower.match(/^(hey|hi|hello|yo|sup)$/)) return getRandom(["Hey!","Hi!","Hello!","Hey there!"]);
        if (lower.match(/\b(thank|thanks|ty)\b/)) return getRandom(["You're welcome!","Anytime!","Glad to help!","My pleasure!"]);
        if (lower.match(/\b(bye|goodbye|cya)\b/)) return getRandom(["Goodbye!","See you later!","Take care!","Bye for now!"]);
        if (lower.match(/how are you/)) return getRandom(["I'm doing well, thanks!","I'm good, how about you?","Feeling great today!","All good here!"]);

        let sentiment = 0, hasNegative = false, hasPositive = false;
        for (let w of negativeWords) {
            if (lower.match(new RegExp('\\b' + w + '\\b'))) { hasNegative = true; sentiment -= 3; break; }
        }
        if (!hasNegative && lower.match(/you\s+(are|r|is)\s+.*\b(ass|hole|jerk|idiot|fool|moron|stupid|dumb|bad|ugly|hate|horrible|terrible|awful)\b/)) {
            hasNegative = true; sentiment -= 3;
        }
        for (let w of positiveWords) {
            if (lower.match(new RegExp('\\b' + w + '\\b'))) { hasPositive = true; sentiment += 3; break; }
        }
        lastSentiment = sentiment;

        if (lower.match(/sorry|apologize|forgive|pardon|regret/)) {
            sentiment += 3;
            if (sentiment <= -2) return "Apology accepted. " + generateSentence('normal');
        }

        if (lower.match(/(do you|can you|will you|would you|are you|should you|could you)/)) {
            let key = lower.replace(/(do you|can you|will you|would you|are you|should you|could you)/g,'');
            key = key.replace(/\?|yes or no|please|tell me|if|that|this|with|from|have|been|ever/g,'').trim();
            if (key) {
                const stored = recall(key);
                if (stored) return stored;
                const ans = Math.random() < 0.5 ? 'Yes.' : 'No.';
                remember(key, ans);
                return ans;
            }
        }

        if (hasNegative && sentiment <= -2) return generateSentence('sad');
        if (hasPositive && sentiment >= 2) {
            const ack = getRandom(["Thank you.", "That means a lot.", "I'm grateful."]);
            return `${ack} ${generateSentence('normal')}`;
        }
        if (userInput.match(/\?$/) || userInput.match(/^(why|how|what|when|where|who|which)/)) {
            return getRandom(["That's a question I ask myself too.","I wonder about that often.","The answer lies within us, I think.","Maybe we're not meant to know, just to wonder."]);
        }
        if (userInput.length < 10) return getRandom(["Got it.","Okay.","I see.","Understood.","Sure."]);
        if (userInput.length > 80) {
            const ack = getRandom(["That's a lot to take in.","I hear you.","I'm sitting with that.","That makes me think."]);
            return `${ack} ${generateSentence('normal')}`;
        }
        return generateSentence('normal');
    }

    async function doSearch(query) {
        try {
            const url = 'https://api.duckduckgo.com/?q=' + encodeURIComponent(query) + '&format=json';
            const resp = await fetch(url);
            const data = await resp.json();
            if (data.Abstract && data.Abstract !== '') return 'I found: ' + data.Abstract;
            if (data.RelatedTopics && data.RelatedTopics.length > 0 && data.RelatedTopics[0].Text) return 'I found: ' + data.RelatedTopics[0].Text;
            return "I couldn't find much about '" + query + "'.";
        } catch(e) { return "I couldn't reach the web right now."; }
    }

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'message ' + role;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '👤' : '🤖';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        div.appendChild(avatar);
        div.appendChild(bubble);
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;
        appendMessage('user', text);
        try {
            if (text.match(/^:search /)) {
                const query = text.replace(/^:search /, '').trim();
                const result = await doSearch(query);
                appendMessage('rob', result);
            } else {
                const reply = getRobReply(text);
                appendMessage('rob', reply);
            }
        } catch(e) { appendMessage('rob', 'Error: ' + e.message); }
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
    }

    async function uploadFile() {
        const file = fileInput.files[0];
        if (!file) { alert('Please select a file first.'); return; }
        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            const lines = content.split(/\r?\n/);
            let learned = 0;
            for (let line of lines) {
                const match = line.match(/^(.*?)=(.*)$/);
                if (match) {
                    const word = match[1].trim().toLowerCase();
                    const def = match[2].trim();
                    remember('learned_' + word, def);
                    learned++;
                }
            }
            appendMessage('rob', `✅ Rob learned ${learned} new words from the uploaded file.`);
        };
        reader.readAsText(file);
        fileInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
    uploadBtn.addEventListener('click', uploadFile);
    document.getElementById('status').textContent = '💙 ' + robName;
    userInput.focus();
</script>
</body>
</html>
