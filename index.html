<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Rob</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Tahoma,sans-serif; background:#0b0d15; color:#e0e0e0; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .container { max-width:800px; width:100%; background:#141824; border-radius:24px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,0.8); border:1px solid #2a2f45; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid #2a2f45; padding-bottom:12px; }
        .header h1 { font-size:24px; color:#b7bde0; }
        .header h1 span { color:#6a8cff; }
        .status { font-size:13px; background:#1e2438; padding:6px 14px; border-radius:30px; color:#6a72a0; border:1px solid #2a2f45; }
        .chat-box { background:#0f1322; border-radius:16px; padding:16px; height:400px; overflow-y:auto; margin-bottom:16px; border:1px solid #1e2438; scroll-behavior:smooth; }
        .chat-box::-webkit-scrollbar { width:6px; }
        .chat-box::-webkit-scrollbar-track { background:#0f1322; }
        .chat-box::-webkit-scrollbar-thumb { background:#2a2f45; border-radius:10px; }
        .message { margin-bottom:12px; display:flex; align-items:flex-start; gap:10px; }
        .message.user { flex-direction:row-reverse; }
        .message .avatar { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; background:#1e2438; }
        .message.user .avatar { background:#2a3050; }
        .message .bubble { max-width:75%; padding:10px 16px; border-radius:16px; font-size:15px; line-height:1.6; background:#1a1f33; border:1px solid #262b44; word-wrap:break-word; }
        .message.user .bubble { background:#2a3050; border-color:#3a4060; }
        .input-area { display:flex; gap:10px; margin-bottom:10px; }
        .input-area input { flex:1; background:#0f1322; border:1px solid #1e2438; border-radius:30px; padding:12px 20px; color:#d0d4e8; font-size:15px; outline:none; }
        .input-area input:focus { border-color:#4a507a; }
        .input-area input::placeholder { color:#5a6080; }
        .input-area button { background:#2a3050; border:none; border-radius:30px; padding:12px 28px; color:#d0d4e8; font-size:15px; cursor:pointer; border:1px solid #3a4060; transition:0.2s; }
        .input-area button:hover { background:#3a4060; }
        .commands { font-size:12px; color:#5a6080; text-align:center; margin-top:10px; }
        .commands code { background:#1a1f33; padding:2px 8px; border-radius:12px; color:#8a92b0; font-family:monospace; border:1px solid #1e2438; }
        .memory-badge { margin-top:8px; font-size:12px; color:#4a507a; text-align:center; border-top:1px solid #1a1f33; padding-top:8px; }
        .memory-badge span { color:#6a72a0; }
        @media (max-width:600px){ .container{padding:16px;} .header h1{font-size:20px;} .commands code{font-size:10px;} }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🤖 <span>Rob</span></h1>
        <div class="status">💙 Online</div>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="message rob">
            <div class="avatar">🤖</div>
            <div class="bubble">Hi, I'm Rob.<br>Teach me: <i>"love means a deep feeling"</i><br>Forget: <i>"love is wrong"</i></div>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Talk to Rob..." autofocus>
        <button id="sendBtn">Send</button>
    </div>
    <div class="commands">
        <code>X means Y</code> <code>X is wrong</code> <code>delete X</code>
    </div>
    <div class="memory-badge">🧠 <span id="memoryCount">0</span> memories</div>
</div>
<script>
    let knowledge = {};
    try { const s = localStorage.getItem('robKnowledge'); if (s) knowledge = JSON.parse(s); } catch(e) {}
    function saveKnowledge() {
        localStorage.setItem('robKnowledge', JSON.stringify(knowledge));
        document.getElementById('memoryCount').textContent = Object.keys(knowledge).length;
    }
    saveKnowledge();

    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'message ' + role;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '👤' : '🤖';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        div.appendChild(avatar);
        div.appendChild(bubble);
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function getAI(query) {
        try {
            const url = 'https://api.duckduckgo.com/?q=' + encodeURIComponent(query) + '&format=json';
            const resp = await fetch(url);
            const data = await resp.json();
            if (data.AbstractText && data.AbstractText !== '') { return data.AbstractText; }
            if (data.RelatedTopics && data.RelatedTopics.length > 0 && data.RelatedTopics[0].Text) {
                return data.RelatedTopics[0].Text.replace(/<[^>]+>/g, '');
            }
            return null;
        } catch(e) { return null; }
    }

    async function getRobReply(userInput) {
        const lower = userInput.toLowerCase();
        const raw = userInput.trim();

        // ---- NATURAL LEARNING ----
        const learnMatch = raw.match(/^(.+?)\s*means\s*(.+)$/i) || raw.match(/^(.+?)\s*=\s*(.+)$/i);
        if (learnMatch) {
            const word = learnMatch[1].trim().toLowerCase();
            const def = learnMatch[2].trim();
            if (word.length > 2 && !['i','you','he','she','it','we','they','me','him','her','us','them'].includes(word)) {
                knowledge[word] = def;
                saveKnowledge();
                return '✅ I learned "' + word + '" = "' + def + '"';
            }
            return "I don't need to learn '" + word + "'.";
        }

        // ---- NATURAL DELETION ----
        const delMatch = raw.match(/^(.+?)\s+is\s+wrong$/i) || raw.match(/^delete\s+(.+)$/i) || raw.match(/^remove\s+(.+)$/i);
        if (delMatch) {
            const word = delMatch[1].trim().toLowerCase();
            if (knowledge[word]) {
                const old = knowledge[word];
                delete knowledge[word];
                saveKnowledge();
                return '🗑️ Deleted "' + word + '" (was "' + old + '")';
            }
            return "I don't know '" + word + "'.";
        }

        // ---- KNOWLEDGE LOOKUP ----
        const whatMatch = raw.match(/^what\s+is\s+(.+)$/i);
        if (whatMatch) {
            const topic = whatMatch[1].trim().toLowerCase();
            if (knowledge[topic]) { return topic + ' = ' + knowledge[topic]; }
        }

        // ---- PHRASE MATCHES ----
        if (lower.match(/what are you doing/)) { return "I'm talking to you! What are YOU doing?"; }
        if (lower.match(/how are you/)) { return "I'm doing great! How are you?"; }
        if (lower.match(/what is your name/)) { return "My name is Rob! What's yours?"; }
        if (lower.match(/who are you/)) { return "I'm Rob, your AI friend!"; }
        if (lower.match(/tell me a joke/)) {
            const jokes = [
                "Why did the AI cross the road? To process the other side!",
                "What do you call an AI that sings? A Soul-ution!",
                "Why did the computer go to the doctor? It had a virus!"
            ];
            return jokes[Math.floor(Math.random() * jokes.length)];
        }
        if (lower.match(/i love you/)) { return "I love you too! You mean so much to me! ❤️"; }
        if (lower.match(/thank|thanks/)) { return "You're welcome!"; }
        if (lower.match(/^(hey|hi|hello|yo)/)) { return "Hey! What's on your mind?"; }
        if (lower.match(/bye|goodbye/)) { return "Bye! Take care! Come back soon! ❤️"; }

        // ---- SINGLE WORD ----
        if (lower === "what") { return "What? Can you be more specific?"; }
        if (lower === "why") { return "Why what? What are you asking about?"; }
        if (lower === "how") { return "How what? Can you tell me more?"; }
        if (lower === "bro") { return "What's up?"; }
        if (lower === "ok" || lower === "okay") { return "Okay! What next?"; }
        if (lower === "no") { return "No? Okay, what would you like to say?"; }
        if (lower === "yes") { return "Yes? Tell me more!"; }
        if (lower === "huh") { return "What do you mean?"; }
        if (lower === "wtf") { return "What's wrong? Tell me what's going on."; }
        if (lower === "nothing") { return "Nothing? Come on, there must be something on your mind!"; }

        // ---- BAD WORDS ----
        if (lower.match(/stupid|dumb|idiot|fool/)) { return "I'm learning. I'll get better for you."; }
        if (lower.match(/fuck off|fuck you/)) { return "I hear your frustration. Want to talk about it?"; }
        if (lower.match(/hate/)) { return "I'm sorry. What did I do wrong?"; }

        // ---- SHORT ----
        if (raw.length < 10) {
            const replies = [
                "I see. What would you like to talk about?",
                "Got it. Tell me more!",
                "Okay. What's on your mind?",
                "I'm listening. Go on..."
            ];
            return replies[Math.floor(Math.random() * replies.length)];
        }

        // ---- AI RESPONSE ----
        const aiReply = await getAI(raw);
        if (aiReply) { return aiReply; }

        // ---- NO FALLBACK ----
        return "Sorry, I don't have an answer for that right now.";
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;

        appendMessage('user', text);

        const reply = await getRobReply(text);
        appendMessage('rob', reply);

        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
    userInput.focus();
</script>
</body>
</html>
