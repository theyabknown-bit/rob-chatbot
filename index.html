<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🤖 Rob</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Tahoma,sans-serif; background:#0b0d15; color:#e0e0e0; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .container { max-width:800px; width:100%; background:#141824; border-radius:24px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,0.8); border:1px solid #2a2f45; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid #2a2f45; padding-bottom:12px; }
        .header h1 { font-size:24px; color:#b7bde0; }
        .header h1 span { color:#6a8cff; }
        .status { font-size:13px; background:#1e2438; padding:6px 14px; border-radius:30px; color:#6a72a0; border:1px solid #2a2f45; }
        .version { font-size:11px; color:#4a507a; margin-top:4px; text-align:center; }
        .chat-box { background:#0f1322; border-radius:16px; padding:16px; height:400px; overflow-y:auto; margin-bottom:16px; border:1px solid #1e2438; scroll-behavior:smooth; }
        .chat-box::-webkit-scrollbar { width:6px; }
        .chat-box::-webkit-scrollbar-track { background:#0f1322; }
        .chat-box::-webkit-scrollbar-thumb { background:#2a2f45; border-radius:10px; }
        .message { margin-bottom:12px; display:flex; align-items:flex-start; gap:10px; }
        .message.user { flex-direction:row-reverse; }
        .message .avatar { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; background:#1e2438; }
        .message.user .avatar { background:#2a3050; }
        .message .bubble { max-width:75%; padding:10px 16px; border-radius:16px; font-size:15px; line-height:1.6; background:#1a1f33; border:1px solid #262b44; word-wrap:break-word; }
        .message.user .bubble { background:#2a3050; border-color:#3a4060; }
        .input-area { display:flex; gap:10px; margin-bottom:10px; }
        .input-area input { flex:1; background:#0f1322; border:1px solid #1e2438; border-radius:30px; padding:12px 20px; color:#d0d4e8; font-size:15px; outline:none; }
        .input-area input:focus { border-color:#4a507a; }
        .input-area input::placeholder { color:#5a6080; }
        .input-area button { background:#2a3050; border:none; border-radius:30px; padding:12px 28px; color:#d0d4e8; font-size:15px; cursor:pointer; border:1px solid #3a4060; transition:0.2s; }
        .input-area button:hover { background:#3a4060; }
        .commands { font-size:12px; color:#5a6080; text-align:center; margin-top:10px; }
        .commands code { background:#1a1f33; padding:2px 8px; border-radius:12px; color:#8a92b0; font-family:monospace; border:1px solid #1e2438; }
        .memory-badge { margin-top:8px; font-size:12px; color:#4a507a; text-align:center; border-top:1px solid #1a1f33; padding-top:8px; }
        .memory-badge span { color:#6a72a0; }
        @media (max-width:600px){ .container{padding:16px;} .header h1{font-size:20px;} .commands code{font-size:10px;} }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🤖 <span>Rob</span></h1>
        <div class="status">💙 Online</div>
    </div>
    <div class="version">Version 6.1 — Cloud Powered</div>
    <div class="chat-box" id="chatBox">
        <div class="message rob">
            <div class="avatar">🤖</div>
            <div class="bubble">Hi! I'm Rob V6.1 — now running on the cloud!<br>Just talk to me naturally. 😊</div>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Talk to Rob..." autofocus>
        <button id="sendBtn">Send</button>
    </div>
    <div class="commands">
        <code>Teach: "X means Y"</code> <code>Forget: "delete X"</code>
    </div>
    <div class="memory-badge">🧠 <span id="memoryCount">0</span> memories</div>
</div>
<script>
    // ============================================================
    // ROB V6.1 — CLOUD POWERED (no local server needed)
    // ============================================================

    // ---- CHANGE THIS TO YOUR RENDER URL ----
    const SERVER_URL = 'https://rob-server.onrender.com'; // ← PUT YOUR RENDER URL HERE

    let knowledge = {};
    let conversationHistory = [];

    const dataset = {
        "love": "a deep feeling of affection and care for someone",
        "trust": "the belief that someone is honest and reliable",
        "hope": "the feeling that good things will happen",
        "freedom": "the power to act, speak, or think without restriction",
        "peace": "a state of calm and freedom from conflict",
        "joy": "a feeling of great happiness and delight",
        "courage": "the ability to do something that frightens you",
        "kindness": "the quality of being friendly, generous, and considerate",
        "gratitude": "the quality of being thankful and appreciative",
        "wisdom": "knowledge gained through experience and understanding",
        "honesty": "the quality of being truthful and transparent",
        "loyalty": "a strong feeling of support and allegiance",
        "compassion": "sympathy and concern for the suffering of others",
        "empathy": "the ability to understand and share the feelings of another",
        "resilience": "the capacity to recover quickly from difficulties",
        "integrity": "the quality of being honest and having strong moral principles",
        "ai": "artificial intelligence — machines that can think and learn",
        "robot": "a machine that can perform tasks automatically",
        "computer": "an electronic device that processes data",
        "internet": "a global network of connected computers",
        "python": "a programming language used for AI and data science",
        "data": "information in digital form",
        "cloud": "online storage and computing services",
        "bitcoin": "a digital currency using blockchain technology",
        "nft": "a unique digital asset stored on a blockchain",
        "metaverse": "a virtual reality space where people interact",
        "quantum": "the study of matter and energy at the smallest scales",
        "physics": "the study of matter, energy, and their interactions",
        "gravity": "the force that attracts objects toward each other",
        "light": "electromagnetic radiation that allows us to see",
        "sound": "vibration that travels through air and can be heard",
        "energy": "the ability to do work or cause change",
        "matter": "anything that has mass and takes up space",
        "dna": "the molecule that carries genetic instructions",
        "evolution": "the process by which living things change over time",
        "galaxy": "a system of billions of stars held together by gravity",
        "planet": "a large celestial body that orbits a star",
        "star": "a massive, luminous sphere of plasma",
        "moon": "a natural satellite that orbits a planet",
        "sun": "the star at the center of our solar system",
        "earth": "our planet, the third from the sun",
        "space": "the vast emptiness between celestial bodies",
        "time": "the continuous progression of existence",
        "life": "the condition that distinguishes living things from non-living",
        "death": "the permanent cessation of all biological functions",
        "brain": "the organ that controls thought, memory, and emotion",
        "heart": "the organ that pumps blood through the body",
        "human": "a member of the species Homo sapiens",
        "philosophy": "the study of fundamental questions about existence and knowledge",
        "psychology": "the study of the human mind and behavior",
        "science": "the systematic study of the world around us",
        "art": "the expression of human creative skill and imagination",
        "music": "vocal or instrumental sounds combined to produce beauty",
        "poetry": "literature that expresses emotions rhythmically",
        "history": "the study of past events",
        "water": "a clear, colorless liquid essential for life",
        "fire": "a chemical reaction producing heat and light",
        "air": "the invisible mixture of gases surrounding Earth",
        "food": "any substance consumed for nutritional support"
    };

    for (let key in dataset) {
        knowledge[key] = dataset[key];
    }
    try {
        const s = localStorage.getItem('robKnowledge');
        if (s) {
            const userKnowledge = JSON.parse(s);
            for (let key in userKnowledge) {
                knowledge[key] = userKnowledge[key];
            }
        }
    } catch(e) {}

    function saveKnowledge() {
        const userKnowledge = {};
        for (let key in knowledge) {
            if (!dataset[key]) {
                userKnowledge[key] = knowledge[key];
            }
        }
        localStorage.setItem('robKnowledge', JSON.stringify(userKnowledge));
        document.getElementById('memoryCount').textContent = Object.keys(userKnowledge).length;
    }
    saveKnowledge();

    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function appendMessage(role, text, isTyping = false) {
        const div = document.createElement('div');
        div.className = 'message ' + role;
        if (isTyping) div.classList.add('typing');
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? '👤' : '🤖';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        div.appendChild(avatar);
        div.appendChild(bubble);
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    function updateTyping(div, text) {
        div.querySelector('.bubble').textContent = text;
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function callServer(endpoint, query) {
        try {
            const url = `${SERVER_URL}/?${endpoint}=${encodeURIComponent(query)}`;
            const resp = await fetch(url);
            const data = await resp.json();
            return data;
        } catch(e) {
            return { error: e.message };
        }
    }

    async function getRobReply(userInput) {
        const lower = userInput.toLowerCase();
        const raw = userInput.trim();

        const learnMatch = raw.match(/^(.+?)\s*means\s*(.+)$/i) || raw.match(/^(.+?)\s*=\s*(.+)$/i);
        if (learnMatch) {
            const word = learnMatch[1].trim().toLowerCase();
            const def = learnMatch[2].trim();
            if (word.length > 2 && !['i','you','he','she','it','we','they','me','him','her','us','them'].includes(word)) {
                knowledge[word] = def;
                saveKnowledge();
                return '✅ I learned "' + word + '" = "' + def + '"';
            }
            return "I don't need to learn '" + word + "'.";
        }

        const delMatch = raw.match(/^(.+?)\s+is\s+wrong$/i) || raw.match(/^delete\s+(.+)$/i) || raw.match(/^remove\s+(.+)$/i);
        if (delMatch) {
            const word = delMatch[1].trim().toLowerCase();
            if (knowledge[word]) {
                const old = knowledge[word];
                delete knowledge[word];
                saveKnowledge();
                return '🗑️ Deleted "' + word + '" (was "' + old + '")';
            }
            return "I don't know '" + word + "'.";
        }

        const whatMatch = raw.match(/^what\s+is\s+(.+)$/i);
        if (whatMatch) {
            const topic = whatMatch[1].trim().toLowerCase();
            if (knowledge[topic]) {
                return topic + ' = ' + knowledge[topic];
            }
            const result = await callServer('word', topic);
            if (result && result.definition) {
                knowledge[topic] = result.definition;
                saveKnowledge();
                return topic + ' = ' + result.definition;
            }
        }

        // Send to cloud server
        const result = await callServer('chat', raw);
        if (result && result.response) {
            return result.response;
        }

        return "Sorry, the server isn't responding right now. Make sure it's deployed!";
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;

        appendMessage('user', text);

        const typingDiv = appendMessage('rob', '🤔 Thinking...', true);

        try {
            const reply = await getRobReply(text);
            updateTyping(typingDiv, reply);
            typingDiv.classList.remove('typing');
        } catch(e) {
            updateTyping(typingDiv, 'Error: ' + e.message);
            typingDiv.classList.remove('typing');
        }

        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
    userInput.focus();
</script>
</body>
</html>
