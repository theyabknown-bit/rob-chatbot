<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Aura Works</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0b0d15;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 700px; }
        .logo {
            font-size: 80px;
            font-weight: 900;
            background: linear-gradient(135deg, #00e5ff, #ff33cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }
        .sub { font-size: 24px; color: #6a72a0; margin-bottom: 40px; }
        .btn {
            display: inline-block;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #6a8cff, #a78bfa);
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 30px rgba(106, 140, 255, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
            margin: 8px;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(106, 140, 255, 0.5); }
        .btn-backup {
            background: linear-gradient(135deg, #ff6b6b, #ff3366);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
        }
        .btn-backup:hover { box-shadow: 0 0 50px rgba(255, 107, 107, 0.5); }
        .btn-retry {
            background: linear-gradient(135deg, #ffa94d, #ff7a00);
            box-shadow: 0 0 30px rgba(255, 169, 77, 0.3);
        }
        .btn-retry:hover { box-shadow: 0 0 50px rgba(255, 169, 77, 0.5); }
        .loading { color: #6a72a0; font-size: 18px; margin-top: 20px; }
        .status { font-size: 20px; margin: 20px 0; }
        .status.success { color: #51cf66; }
        .status.warning { color: #ffa94d; }
        .status.error { color: #ff6b6b; }
        .hidden { display: none; }
        .button-group { margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Aura</div>
        <div class="sub">Your AI companion</div>

        <div id="loadingState">
            <div class="loading" id="loadingMsg">Checking servers...</div>
        </div>

        <div id="successState" class="hidden">
            <div class="status success">✅ Tunnel is available!</div>
            <button class="btn" id="enterBtn">Enter Aura</button>
        </div>

        <div id="fallbackState" class="hidden">
            <div class="status warning">⚠️ Tunnel is not responding.</div>
            <div class="button-group">
                <button class="btn btn-retry" id="retryBtn">🔄 Retry Tunnel</button>
                <button class="btn btn-backup" id="backupBtn">📡 Use Backup (Render)</button>
            </div>
            <div style="font-size:14px; color:#6a72a0; margin-top:10px;">
                The backup server is always online.
            </div>
        </div>

        <div id="errorState" class="hidden">
            <div class="status error">❌ Could not fetch tunnel information.</div>
            <button class="btn btn-backup" id="errorBackupBtn">📡 Use Backup (Render)</button>
        </div>
    </div>
    <script>
        const GIST_URL = 'https://gist.githubusercontent.com/theyabknown-bit/6b6904a28a45cd06ddff08714119860e/raw/gistfile1.txt?t=' + Date.now();
        const RENDER_URL = 'https://aura-r0y6.onrender.com';
        let tunnelUrl = null;

        // UI elements
        const loadingState = document.getElementById('loadingState');
        const successState = document.getElementById('successState');
        const fallbackState = document.getElementById('fallbackState');
        const errorState = document.getElementById('errorState');
        const loadingMsg = document.getElementById('loadingMsg');

        const enterBtn = document.getElementById('enterBtn');
        const retryBtn = document.getElementById('retryBtn');
        const backupBtn = document.getElementById('backupBtn');
        const errorBackupBtn = document.getElementById('errorBackupBtn');

        function showState(state) {
            loadingState.classList.add('hidden');
            successState.classList.add('hidden');
            fallbackState.classList.add('hidden');
            errorState.classList.add('hidden');
            if (state === 'loading') loadingState.classList.remove('hidden');
            if (state === 'success') successState.classList.remove('hidden');
            if (state === 'fallback') fallbackState.classList.remove('hidden');
            if (state === 'error') errorState.classList.remove('hidden');
        }

        // Build URL correctly: base + ?page=aura&v=...
        function buildChatUrl(base) {
            // Remove any existing query string from the base
            const cleanBase = base.split('?')[0];
            return cleanBase + '/?page=aura&v=' + Date.now();
        }

        async function testTunnel(url) {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5000);
                const testUrl = buildChatUrl(url);
                const resp = await fetch(testUrl, {
                    method: 'GET',
                    signal: controller.signal
                });
                clearTimeout(timeout);
                return resp.ok || resp.status === 304 || resp.status === 302 || resp.status === 301;
            } catch (e) {
                return false;
            }
        }

        async function fetchAndTest() {
            showState('loading');
            loadingMsg.textContent = 'Fetching tunnel URL...';
            try {
                const resp = await fetch(GIST_URL);
                if (!resp.ok) throw new Error('Gist fetch failed');
                const text = await resp.text();
                const data = JSON.parse(text);
                if (data && data.tunnel) {
                    tunnelUrl = data.tunnel;
                    loadingMsg.textContent = 'Testing tunnel...';
                    const alive = await testTunnel(tunnelUrl);
                    if (alive) {
                        showState('success');
                    } else {
                        showState('fallback');
                    }
                } else {
                    throw new Error('No tunnel in Gist');
                }
            } catch (e) {
                console.warn('Error:', e);
                showState('error');
            }
        }

        // Event handlers
        enterBtn.addEventListener('click', () => {
            if (tunnelUrl) {
                window.location.href = buildChatUrl(tunnelUrl);
            }
        });

        retryBtn.addEventListener('click', () => {
            if (tunnelUrl) {
                showState('loading');
                loadingMsg.textContent = 'Retrying tunnel...';
                testTunnel(tunnelUrl).then(alive => {
                    if (alive) {
                        showState('success');
                    } else {
                        showState('fallback');
                    }
                });
            } else {
                fetchAndTest();
            }
        });

        backupBtn.addEventListener('click', () => {
            window.location.href = buildChatUrl(RENDER_URL);
        });

        errorBackupBtn.addEventListener('click', () => {
            window.location.href = buildChatUrl(RENDER_URL);
        });

        // Start
        fetchAndTest();
    </script>
</body>
</html>
