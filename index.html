<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Works</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0b0d15;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 700px; }
        .logo {
            font-size: 80px;
            font-weight: 900;
            background: linear-gradient(135deg, #00e5ff, #ff33cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }
        .sub {
            font-size: 24px;
            color: #6a72a0;
            margin-bottom: 40px;
        }
        .btn {
            display: inline-block;
            padding: 16px 48px;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #6a8cff, #a78bfa);
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(106, 140, 255, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(106, 140, 255, 0.5);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Aura</div>
        <div class="sub">Your AI companion</div>
        <button class="btn" id="enterBtn" disabled>Loading…</button>
    </div>

    <script>
        // ----- CONFIG URL (change this to your own Gist raw URL) -----
        const CONFIG_URL = "https://gist.githubusercontent.com/theyabknown-bit/6b6904a28a45cd06ddff08714119860e/raw/063de0fdd03adf7ba0082aeecf976c4540e711ac/gistfile1.txt";

        const btn = document.getElementById('enterBtn');

        async function fetchTunnelUrl() {
            try {
                const resp = await fetch(CONFIG_URL);
                if (!resp.ok) throw new Error('Config not found');
                const data = await resp.json();
                return data.tunnel || null;
            } catch {
                return null;
            }
        }

        async function init() {
            const tunnel = await fetchTunnelUrl();
            if (tunnel) {
                btn.textContent = 'Enter Aura';
                btn.disabled = false;
                btn.addEventListener('click', () => {
                    window.location.href = tunnel + '/?page=aura';
                });
            } else {
                btn.textContent = 'Try Again';
                btn.disabled = false;
                btn.addEventListener('click', () => {
                    window.location.reload();
                });
            }
        }

        init();
    </script>
</body>
</html>
