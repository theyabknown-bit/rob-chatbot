<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Aura Works</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0b0d15;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 700px; }
        .logo {
            font-size: 80px;
            font-weight: 900;
            background: linear-gradient(135deg, #00e5ff, #ff33cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }
        .sub { font-size: 24px; color: #6a72a0; margin-bottom: 40px; }
        .btn {
            display: inline-block;
            padding: 16px 48px;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #6a8cff, #a78bfa);
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 30px rgba(106, 140, 255, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(106, 140, 255, 0.5); }
        .loading { color: #6a72a0; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Aura</div>
        <div class="sub">Your AI companion</div>
        <button class="btn" id="enterBtn">Enter Aura</button>
        <div class="loading" id="loadingMsg">Fetching the latest tunnel...</div>
    </div>
    <script>
        const GIST_URL = 'https://gist.githubusercontent.com/theyabknown-bit/6b6904a28a45cd06ddff08714119860e/raw/gistfile1.txt?t=' + Date.now();
        let tunnelUrl = null;
        async function fetchTunnel() {
            try {
                const resp = await fetch(GIST_URL);
                if (!resp.ok) throw new Error('Gist fetch failed');
                const text = await resp.text();
                const data = JSON.parse(text);
                if (data && data.tunnel) {
                    tunnelUrl = data.tunnel;
                    document.getElementById('loadingMsg').textContent = '✅ Ready! Click "Enter Aura" to chat.';
                    document.getElementById('enterBtn').disabled = false;
                    document.getElementById('enterBtn').style.opacity = 1;
                    return;
                }
            } catch (e) {
                console.warn('Gist fetch failed:', e);
            }
            document.getElementById('loadingMsg').textContent = '❌ Could not fetch tunnel URL. Please try again later.';
            document.getElementById('enterBtn').disabled = true;
            document.getElementById('enterBtn').style.opacity = 0.5;
        }
        document.getElementById('enterBtn').addEventListener('click', () => {
            if (tunnelUrl) window.location.href = tunnelUrl + '/?page=aura&v=' + Date.now();
            else alert('Tunnel URL not yet loaded. Please wait.');
        });
        document.getElementById('enterBtn').disabled = true;
        document.getElementById('enterBtn').style.opacity = 0.5;
        fetchTunnel();
    </script>
</body>
</html>
