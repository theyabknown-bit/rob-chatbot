<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Tahoma,sans-serif; background:#0b0d15; color:#e0e0e0; height:100vh; display:flex; justify-content:center; align-items:center; padding:10px; }
        .container { max-width:700px; width:100%; height:100%; max-height:800px; background:#141824; border-radius:24px; padding:16px; box-shadow:0 20px 60px rgba(0,0,0,0.8); border:1px solid #2a2f45; display:flex; flex-direction:column; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #2a2f45; padding-bottom:10px; flex-shrink:0; }
        .header .logo { display:flex; align-items:center; gap:12px; }
        .header .logo .avatar { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#a78bfa,#6a8cff); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:22px; color:#fff; box-shadow:0 0 20px rgba(167,139,250,0.4); animation:pulse 2s infinite ease-in-out; user-select:none; }
        @keyframes pulse { 0% { box-shadow:0 0 20px rgba(167,139,250,0.4); } 50% { box-shadow:0 0 40px rgba(167,139,250,0.8); } 100% { box-shadow:0 0 20px rgba(167,139,250,0.4); } }
        .header .logo .name { font-size:22px; font-weight:700; background:linear-gradient(135deg,#a78bfa,#6a8cff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:-0.5px; }
        .chat-box { background:#0f1322; border-radius:16px; padding:12px; flex:1; overflow-y:auto; margin-bottom:12px; border:1px solid #1e2438; min-height:200px; }
        .chat-box::-webkit-scrollbar { width:5px; }
        .chat-box::-webkit-scrollbar-track { background:#0f1322; }
        .chat-box::-webkit-scrollbar-thumb { background:#2a2f45; border-radius:10px; }
        .message { margin-bottom:10px; display:flex; align-items:flex-start; gap:8px; }
        .message.user { flex-direction:row-reverse; }
        .message .avatar { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; }
        .message.aura .avatar { background:linear-gradient(135deg,#a78bfa,#6a8cff); color:#fff; box-shadow:0 0 10px rgba(167,139,250,0.3); }
        .message.user .avatar { background:#2a3050; color:#d0d4e8; }
        .message .bubble { max-width:80%; padding:8px 14px; border-radius:16px; font-size:15px; line-height:1.5; background:#1a1f33; border:1px solid #262b44; word-wrap:break-word; }
        .message.user .bubble { background:#2a3050; border-color:#3a4060; }
        .message.typing .bubble { color:#6a72a0; font-style:italic; }
        .input-area { display:flex; gap:10px; flex-shrink:0; }
        .input-area input { flex:1; background:#0f1322; border:1px solid #1e2438; border-radius:30px; padding:12px 16px; color:#d0d4e8; font-size:16px; outline:none; min-height:48px; }
        .input-area input:focus { border-color:#4a507a; }
        .input-area input::placeholder { color:#5a6080; }
        .input-area button { background:#2a3050; border:none; border-radius:30px; padding:12px 24px; color:#d0d4e8; font-size:16px; cursor:pointer; border:1px solid #3a4060; transition:0.2s; min-height:48px; white-space:nowrap; flex-shrink:0; }
        .input-area button:hover { background:#3a4060; }
        .input-area button:disabled { opacity:0.5; cursor:not-allowed; }
        .hint { font-size:11px; color:#4a507a; text-align:center; margin-top:8px; flex-shrink:0; }
        @media (max-width:480px) { .container { padding:12px; border-radius:16px; } .header .logo .name { font-size:18px; } .input-area input { font-size:14px; padding:10px 14px; } .input-area button { font-size:14px; padding:10px 16px; } .message .bubble { font-size:14px; padding:6px 12px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">
            <div class="avatar">A</div>
            <span class="name">Aura</span>
        </div>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="message aura">
            <div class="avatar">A</div>
            <div class="bubble">Hi, I'm Aura. Ask me anything.</div>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Talk to Aura..." autofocus>
        <button id="sendBtn">Send</button>
    </div>
    <div class="hint">Teach: "X means Y" &bull; Forget: "delete X"</div>
</div>
<script>
    // ---- Knowledge base (localStorage) ----
    let knowledge = {};
    let conversationHistory = [];

    const dataset = {
        "love": "a deep feeling of affection",
        "trust": "belief in someone's honesty",
        "hope": "feeling that good things will happen",
        "freedom": "power to act without restriction",
        "peace": "state of calm",
        "joy": "great happiness",
        "courage": "ability to face fear",
        "kindness": "being friendly and considerate",
        "gratitude": "being thankful",
        "wisdom": "knowledge from experience",
        "ai": "artificial intelligence",
        "robot": "machine that performs tasks",
        "computer": "device that processes data",
        "internet": "global network",
        "python": "programming language",
        "data": "information",
        "cloud": "online storage",
        "bitcoin": "digital currency",
        "quantum": "study of smallest scales",
        "physics": "study of matter and energy",
        "gravity": "force that attracts objects",
        "light": "electromagnetic radiation",
        "sound": "vibration",
        "energy": "ability to do work",
        "matter": "has mass and takes space",
        "dna": "genetic instructions",
        "evolution": "change over time",
        "galaxy": "system of stars",
        "planet": "celestial body",
        "star": "luminous sphere",
        "moon": "natural satellite",
        "sun": "center of solar system",
        "earth": "our planet",
        "space": "emptiness between bodies",
        "time": "progression of existence",
        "life": "condition of living",
        "death": "end of life",
        "brain": "organ that controls thought",
        "heart": "organ that pumps blood",
        "human": "member of Homo sapiens",
        "science": "systematic study",
        "art": "creative expression",
        "music": "sounds producing beauty",
        "history": "study of past",
        "water": "clear liquid essential for life",
        "fire": "chemical reaction producing heat",
        "air": "mixture of gases",
        "food": "substance consumed for nutrition"
    };

    for (let key in dataset) { knowledge[key] = dataset[key]; }

    function loadKnowledge() {
        try {
            const s = localStorage.getItem('auraKnowledge');
            if (s) {
                const u = JSON.parse(s);
                for (let key in u) {
                    knowledge[key] = u[key];
                }
            }
        } catch(e) {}
    }
    function saveKnowledge() {
        const u = {};
        for (let key in knowledge) {
            if (!dataset[key]) {
                u[key] = knowledge[key];
            }
        }
        localStorage.setItem('auraKnowledge', JSON.stringify(u));
    }
    loadKnowledge();

    function loadHistory() {
        try {
            const h = localStorage.getItem('auraChatHistory');
            if (h) {
                conversationHistory = JSON.parse(h);
            }
        } catch(e) {}
    }
    function saveHistory() {
        localStorage.setItem('auraChatHistory', JSON.stringify(conversationHistory));
    }
    loadHistory();

    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'message ' + role;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = role === 'user' ? 'U' : 'A';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        div.appendChild(avatar);
        div.appendChild(bubble);
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }

    function updateTyping(div, text) {
        div.querySelector('.bubble').textContent = text;
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // ---- DuckDuckGo API (free, no key) ----
    async function getDDG(query) {
        try {
            const url = 'https://api.duckduckgo.com/?q=' + encodeURIComponent(query) + '&format=json';
            const resp = await fetch(url);
            const data = await resp.json();
            if (data.AbstractText && data.AbstractText !== '') {
                return data.AbstractText;
            }
            if (data.RelatedTopics && data.RelatedTopics.length > 0 && data.RelatedTopics[0].Text) {
                return data.RelatedTopics[0].Text.replace(/<[^>]+>/g, '');
            }
            return null;
        } catch(e) {
            return null;
        }
    }

    // ---- Aura's brain ----
    async function getReply(input) {
        const raw = input.trim();
        const lower = raw.toLowerCase();

        // Learn
        const learnMatch = raw.match(/^(.+?)\s*means\s*(.+)$/i) || raw.match(/^(.+?)\s*=\s*(.+)$/i);
        if (learnMatch) {
            const word = learnMatch[1].trim().toLowerCase();
            const def = learnMatch[2].trim();
            if (word.length > 2 && !['i','you','he','she','it','we','they','me','him','her','us','them'].includes(word)) {
                knowledge[word] = def;
                saveKnowledge();
                return '✅ I learned "' + word + '" = "' + def + '"';
            }
            return "I don't need to learn '" + word + "'.";
        }

        // Delete
        const delMatch = raw.match(/^(.+?)\s+is\s+wrong$/i) || raw.match(/^delete\s+(.+)$/i) || raw.match(/^remove\s+(.+)$/i);
        if (delMatch) {
            const word = delMatch[1].trim().toLowerCase();
            if (knowledge[word]) {
                const old = knowledge[word];
                delete knowledge[word];
                saveKnowledge();
                return '🗑️ Deleted "' + word + '" (was "' + old + '")';
            }
            return "I don't know '" + word + "'.";
        }

        // What is
        const whatMatch = raw.match(/^what\s+is\s+(.+)$/i);
        if (whatMatch) {
            const topic = whatMatch[1].trim().toLowerCase();
            if (knowledge[topic]) {
                return topic + ' = ' + knowledge[topic];
            }
        }

        // Try DuckDuckGo for any question or search
        const ddgReply = await getDDG(raw);
        if (ddgReply) {
            conversationHistory.push({ role: 'user', content: raw });
            conversationHistory.push({ role: 'assistant', content: ddgReply });
            saveHistory();
            return ddgReply;
        }

        // Generic fallback
        const fallbacks = [
            "I don't know the answer to that. Can you ask something else?",
            "Hmm, I'm not sure. What do you think?",
            "That's a good question. I don't have an answer right now.",
            "I'm not sure about that. Tell me more."
        ];
        const reply = fallbacks[Math.floor(Math.random() * fallbacks.length)];
        conversationHistory.push({ role: 'user', content: raw });
        conversationHistory.push({ role: 'assistant', content: reply });
        saveHistory();
        return reply;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;

        appendMessage('user', text);

        const typingDiv = appendMessage('aura', '🤔 Thinking...');
        typingDiv.classList.add('typing');

        try {
            const reply = await getReply(text);
            updateTyping(typingDiv, reply);
            typingDiv.classList.remove('typing');
        } catch(e) {
            updateTyping(typingDiv, 'Error: ' + e.message);
            typingDiv.classList.remove('typing');
        }

        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
    userInput.focus();
</script>
</body>
</html>
